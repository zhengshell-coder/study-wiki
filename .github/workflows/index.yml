name: 按文件夹生成目录与全文索引
on:
  push:
    branches: [main]
    paths: ["**/*.html"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_library.py
      - name: 提交索引变化
        run: |
          if [ -n "$(git status --porcelain catalog.json search-index.json reading.json)" ]; then
            git config user.name "library-bot"; git config user.email "bot@users.noreply.github.com"
            git add catalog.json search-index.json reading.json && git commit -m "目录与全文索引：自动生成" && git push
          fi
