var cur=-1,timer=null,jobId=0,mode='ov',dK=null,dPart=null;

function setTier(k,on,dim){q('.tier[data-k="'+k+'"]').forEach(function(g){
  g.classList.toggle('on',on);g.classList.toggle('dim',!!dim);});}

function render(i){
  if(i<0||i>=S.length)return;
  cur=i;jobId++;
  var s=S[i];
  var showList=s.show.slice();
  if(s.pillars||s.intro) showList.push('oss','infra');
  TIERS.concat(PILLAR).forEach(function(t){
    var on=showList.indexOf(t.k)>=0, dim=on&&s.hl&&s.hl!==t.k;
    setTier(t.k,on,dim);});
  q('#links line').forEach(function(l){
    var vis=s.show.indexOf(l.getAttribute('data-from'))>=0;
    l.style.opacity=vis?1:0; l.classList.toggle('hot',!!s.funnel);});
  q('#bands rect').forEach(function(b){b.classList.toggle('hl',s.hl===b.getAttribute('data-k'));});
  q('#labels .ct').forEach(function(e){e.setAttribute('opacity',s.tech?0:1);});
  q('#labels .tech').forEach(function(e){e.setAttribute('opacity',s.tech?1:0);});
  TIERS.forEach(function(t){
    var bar=document.querySelector('#costbars rect[data-k="'+t.k+'"]');
    var lab=document.querySelector('#costbars text[data-k="'+t.k+'"]');
    if(s.cost){bar.classList.add('on');bar.setAttribute('width',26+t.cost*15.2);
      lab.setAttribute('opacity',1);lab.textContent=t.cost+'%';}
    else{bar.classList.remove('on');bar.setAttribute('width',0);lab.setAttribute('opacity',0);}});
  body.setAttribute('data-view', s.view||'ov');
  if(s.view==='flow'||s.view==='cost'){
    q('.opsg').forEach(function(gg){
      var k=gg.getAttribute('data-g'), on=(k==='head')||(s.reveal||[]).indexOf(k)>=0;
      gg.classList.toggle('on',on);
      gg.classList.toggle('dim', on && k!=='head' && !!s.opshl && s.opshl!==k);
    });
  }
  clearTrail();
  drawNarr(s);
  drawDots();
  drawSubs();
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
  q('#acts .act').forEach(function(a,ai){a.classList.toggle('on',ai===s.act);});
  if(s.route)setTimeout(function(){playRoute(s.route,jobId);},420);
}

function drawNarr(s){
  var h='';
  h+='<div class="tag">'+(s.tag?s.tag:s.intro?'START HERE':s.act===0?'BUILD':s.act===1?'JOURNEY':s.act===2?'THE MONEY':s.act===3?'ORGANISATION':s.act===4?'HOW IT RUNS':s.act===5?'COST & CHANGE':s.act===6?'PLATFORMS & VENDORS':'JARGON')+'</div>';
  var ap=actPages(s.act);
  h=h.replace('</div>','<span class="pager">'+(ap.indexOf(cur)+1)+' / '+ap.length+'</span></div>');
  h+='<h2>'+L(s.title)+'</h2><div class="body">'+L(s.body)+'</div>';
  if(s.analogy)h+='<div class="analogy">'+L(s.analogy)+'</div>';
  if(s.stat)h+='<div class="stat"><div class="v">'+s.stat.v+'</div><div class="l">'+L(s.stat.l)+'</div></div>';
  if(s.usage){h+='<div class="uses">';
    s.usage.forEach(function(u){h+='<div class="use"><span class="uk">'+u.k+'</span><span class="uv">'+L({zh:u.z,en:u.e})+'</span></div>';});
    h+='</div>';}
  if(s.open)h+='<div class="hint" data-open="'+s.open+'">＋ '+L({zh:'点开这一层，看里面到底有什么',en:'Open this layer and look inside'})+'</div>';
  if(s.route){
    h+='<div class="routes" id="routes">';
    ['call','video','home'].forEach(function(k){
      h+='<button data-r="'+k+'" class="'+(k===s.route?'on':'')+'">'+L(ROUTES[k].name)+'</button>';});
    h+='</div><div class="seg" id="seg"><div class="s-n">READY</div><div class="s-t">'+
       L({zh:'点上面切换，或按 ▶ 重播',en:'Pick a route, or press ▶'})+'</div></div>';
  }
  if(s.costs){
    h+='<div class="costs">';
    TIERS.forEach(function(t){
      h+='<div class="crow"><div class="cl">'+L(t.nm)+'</div><div class="ct"><div class="cf" style="width:'+
         (t.cost/55*100)+'%;background:'+t.color+'"></div></div><div class="cv">'+t.cost+'%</div></div>';});
    h+='</div><div style="font-size:10.5px;color:var(--faint);margin-top:8px">'+
       L({zh:'网络 opex 占比 · 行业示意区间，需以实际账目替换。OSS 与机房底座的成本（运维人力、电费、软件许可）已分摊在上述五层中，不单列。',en:'share of network opex · indicative. OSS and facility costs are spread across the five layers, not a separate line.'})+'</div>';
  }
  if(s.levers){h+='<div class="terms">';
    LEVERS.slice().reverse().forEach(function(v){var t=TK[v.k];
      h+='<div class="term"><span class="a" style="color:'+t.color+'">'+L(t.nm)+
         '</span><span class="b" style="color:#3f382d;font-family:var(--sans);font-weight:400">'+L(v)+'</span></div>';});
    h+='</div>';}
  if(s.terms){h+='<div class="terms">';
    TERMS.forEach(function(v){h+='<div class="term"><span class="a">'+L(v.a)+'</span><span class="ar">→</span><span class="b">'+v.b+'</span></div>';});
    h+='</div>';}
  if(s.cfo)h+='<div class="cfo"><div class="h">CFO takeaway</div><div class="t">'+L(s.cfo)+'</div></div>';
  if(!s.cfo)h+='<div style="margin-top:auto"></div>';
  h+=nextHtml();
  document.getElementById('narr').innerHTML='<div class="fit">'+h+'</div>';
  fitNarr();
  var rt=document.getElementById('routes');
  if(rt)rt.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    S[cur].route=b.getAttribute('data-r');render(cur);});
}
function drawSubs(){
  var s=S[cur],h='<span class="lab">'+L({zh:ACTS[s.act].n+' 本章 '+actPages(s.act).length+' 页：',en:ACTS[s.act].n+' · '+actPages(s.act).length+' pages:'})+'</span>';
  actPages(s.act).forEach(function(i,j){
    if(j)h+='<span class="arr">›</span>';
    h+='<button data-i="'+i+'" class="'+(i===cur?'on':(i<cur?'done':''))+'"><span class="i">'+(j+1)+'</span>'+L(S[i].sh)+'</button>';});
  document.getElementById('subs').innerHTML=h;
}
function actPages(a){var r=[];S.forEach(function(x,i){if(x.act===a)r.push(i);});return r;}
function nextHtml(){
  if(cur>=S.length-1)return '';
  var n=S[cur+1],same=n.act===S[cur].act;
  var k=same?L({zh:'本章下一页',en:'Next in this act'}):L({zh:'下一章 · '+ACTS[n.act].n,en:'Next act · '+ACTS[n.act].n});
  return '<div class="nextbtn" id="nextCard"><span><span class="k">'+k+'</span>'+L(same?n.title:ACTS[n.act].t)+'</span><span class="go">→</span></div>';
}
function fitNarr(){
  var n=document.getElementById('narr'),f=n.querySelector('.fit');if(!f)return;
  var k=1;f.style.zoom=1;
  while(n.scrollHeight>n.clientHeight+1&&k>0.7){k-=0.03;f.style.zoom=k;}
}
window.addEventListener('resize',fitNarr);
function drawDots(){var d=document.getElementById('dots'),h='';
  S.forEach(function(s,i){h+='<div class="dot '+(i===cur?'on':(i<cur?'done':''))+'" data-i="'+i+'"></div>';});
  d.innerHTML=h;}

/* ---------- 解剖视图 ---------- */
function enterDetail(k,part){
  if(!DETAIL[k])return;
  stop();mode='dt';dK=k;dPart=part||null;body.setAttribute('data-mode','dt');
  jobId++;clearTrail();
  while(gDetail.firstChild)gDetail.removeChild(gDetail.firstChild);
  var t=TK[k];
  /* 左侧层级导航 */
  var nav=el('g',{});
  ORDER.slice().reverse().concat(['oss','infra']).forEach(function(kk,ix){
    var tt=TK[kk],y=60+ix*44,on=kk===k;
    var gg=el('g',{class:'dpart'});gg.setAttribute('data-goto',kk);
    gg.appendChild(el('rect',{x:24,y:y,width:126,height:34,rx:8,
      fill:on?'rgba(255,255,255,.85)':'rgba(255,255,255,.5)',stroke:on?tt.color:'rgba(62,52,38,.19)','stroke-width':on?1.8:1}));
    gg.appendChild(T(87,y+21,tt.nm,'dlab','middle',11,on?'#2f2a22':'#6f6555'));
    gg.appendChild(el('rect',{x:24,y:y,width:126,height:34,class:'hit'}));
    nav.appendChild(gg);});
  nav.appendChild(T(87,44,{zh:'层级',en:'Layers'},'dnote','middle',10,'#7a7060'));
  gDetail.appendChild(nav);
  /* 标题 */
  gDetail.appendChild(T(200,58,t.nm,'dlab','start',19,t.color));
  gDetail.appendChild(T(200,80,DETAIL[k].link||{zh:'展开：里面到底有什么',en:'Opened up: what is inside'},'dnote','start',11.5,'#6f6555'));
  /* 内容 */
  var gg=el('g',{class:'anim-in'});
  DETAIL[k].draw(gg);
  gDetail.appendChild(gg);
  selectPart(part||null);
  drawDetailNarr();
}
function selectPart(p){
  dPart=p;
  q('#detail .dpart').forEach(function(n){
    n.classList.toggle('sel',!!p&&n.getAttribute('data-part')===p);});
}
function drawDetailNarr(){
  var D=DETAIL[dK],t=TK[dK],h='';
  h+='<div class="crumb"><span class="c1" id="crumbBack">'+L({zh:'全局五层',en:'All five layers'})+'</span> › <span>'+L(t.nm)+'</span></div>';
  h+='<div class="tag" style="color:'+t.color+'">'+L({zh:'展开 · 内部构造',en:'Opened · inside'})+'</div>';
  h+='<h2>'+L(t.nm)+'</h2><div class="body">'+L(D.lead)+'</div>';
  h+='<div class="chips" id="chips">';
  D.order.forEach(function(id){
    h+='<button data-p="'+id+'" class="'+(id===dPart?'on':'')+'">'+L(D.parts[id].nm)+'</button>';});
  h+='</div>';
  if(dPart&&D.parts[dPart]){
    var P=D.parts[dPart];
    h+='<div class="pdet"><div class="pn">'+L(P.nm)+'</div><div class="pt">'+P.tech+'</div>'+
       '<div class="pp">'+L(P.p)+'</div><div class="pc">'+L(P.c)+'</div></div>';
  }else{
    h+='<div class="pdet"><div class="pp">'+L({zh:'点上面的部件，或直接点图里的方块 —— 每个都会给出「大白话 + 技术名 + 对成本意味着什么」。',
        en:'Pick a part above, or click a block in the diagram — each gives plain words, the technical name, and what it means for cost.'})+'</div></div>';
  }
  h+='<div class="cfo"><div class="h">'+L({zh:'讲到多深，你决定',en:'You set the depth'})+'</div><div class="t">'+
     L({zh:'停在这一层就够 —— 或者再点一个部件往下讲。<b>返回全局</b>随时回到五层框架。',
        en:'Stop here — or open one more part. <b>Back</b> returns to the five-layer frame anytime.'})+'</div></div>';
  var ci=CHAIN.indexOf(dK),nk=CHAIN[(ci+1)%CHAIN.length];
  h+='<div class="nextbtn" id="nextLayer"><span><span class="k">'+L({zh:'下一层',en:'Next layer'})+'</span>'+L(TK[nk].nm)+'</span><span class="go">→</span></div>';
  h+='<div class="nextbtn" id="backAll" style="margin-top:7px;background:rgba(109,40,217,.10);border-color:rgba(109,40,217,.4);color:#5b21b6"><span>'+L({zh:'← 返回全局，继续讲解',en:'← Back to the overview'})+'</span></div>';
  document.getElementById('narr').innerHTML='<div class="fit">'+h+'</div>';
  document.getElementById('nextLayer').addEventListener('click',function(){enterDetail(nk);});
  document.getElementById('backAll').addEventListener('click',exitDetail);
  fitNarr();
  document.getElementById('crumbBack').addEventListener('click',exitDetail);
  document.getElementById('chips').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    selectPart(b.getAttribute('data-p'));drawDetailNarr();});
}
function exitDetail(){mode='ov';dK=null;dPart=null;body.setAttribute('data-mode','ov');
  while(gDetail.firstChild)gDetail.removeChild(gDetail.firstChild);
  render(cur<0?0:cur);}

/* ---------- 旅程动画 ---------- */
var trail=document.getElementById('trail'),pkt=document.getElementById('pkt');
function clearTrail(){trail.setAttribute('points','');pkt.setAttribute('r',0);}
function playRoute(rk,job){
  var R=ROUTES[rk];if(!R)return;
  clearTrail();
  trail.style.color=R.color;trail.setAttribute('stroke',R.color);
  pkt.style.color=R.color;pkt.setAttribute('fill',R.color);pkt.setAttribute('r',6);
  var pts=R.pts,acc=[];
  var reduce=body.getAttribute('data-motion')==='off'||window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function caption(i){var seg=R.segs[i];if(!seg)return;var sg=document.getElementById('seg');
    if(sg)sg.innerHTML='<div class="s-n">STEP '+(i+1)+' / '+R.segs.length+'</div><div class="s-t">'+
      L(seg.t)+'</div><div class="s-d">'+L(seg.d)+'</div>';}
  (function run(i){
    if(job!==jobId||mode!=='ov')return;
    if(i>=pts.length-1){caption(i);return;}
    caption(i);
    var a=pts[i],b=pts[i+1],dur=reduce?10:820,t0=null;
    function frame(ts){
      if(job!==jobId||mode!=='ov')return;
      if(!t0)t0=ts;
      var p=Math.min(1,(ts-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      var x=a[0]+(b[0]-a[0])*e,y=a[1]+(b[1]-a[1])*e;
      pkt.setAttribute('cx',x);pkt.setAttribute('cy',y);
      trail.setAttribute('points',acc.concat([x+','+y]).join(' '));
      if(p<1)requestAnimationFrame(frame);
      else{acc.push(b[0]+','+b[1]);setTimeout(function(){run(i+1);},reduce?60:900);}
    }
    acc.push(a[0]+','+a[1]);requestAnimationFrame(frame);
  })(0);
}

/* ---------- 导航 ---------- */
(function(){var h='';ACTS.forEach(function(a,i){
  var pc=S.filter(function(x){return x.act===i;}).length;
  h+='<div class="act" data-a="'+i+'"><span class="n">'+a.n+'</span><span class="t">'+L(a.t)+'</span><span class="pc">'+L({zh:pc+' 页',en:pc+' p'})+'</span></div>';});
  document.getElementById('acts').innerHTML=h;})();

document.getElementById('scene').addEventListener('click',function(e){
  if(mode==='ov'&&e.target.closest('.opsg[data-g="hint"].on')){stop();render(Math.min(S.length-1,cur+1));return;}
  var goto=e.target.closest('[data-goto]');
  if(goto&&mode==='dt'){enterDetail(goto.getAttribute('data-goto'));return;}
  var dp=e.target.closest('[data-part]');
  if(dp&&mode==='dt'){selectPart(dp.getAttribute('data-part'));drawDetailNarr();return;}
  var op=e.target.closest('[data-open]');
  if(op&&mode==='ov'){
    var k=op.getAttribute('data-open'), st=S[cur];
    if(!st)return;
    var vis=st.show.slice(); if(st.pillars||st.intro)vis.push('oss','infra');
    if(vis.indexOf(k)>=0)enterDetail(k);
  }
});
document.getElementById('narr').addEventListener('click',function(e){
  if(e.target.closest('#nextCard')){stop();render(Math.min(S.length-1,cur+1));return;}
  var hint=e.target.closest('.hint[data-open]');
  if(hint)enterDetail(hint.getAttribute('data-open'));
});
document.getElementById('back').addEventListener('click',exitDetail);
document.getElementById('subs').addEventListener('click',function(e){
  var b=e.target.closest('button[data-i]');if(!b)return;stop();render(+b.getAttribute('data-i'));});
document.getElementById('next').addEventListener('click',function(){
  if(mode==='dt'){var i=CHAIN.indexOf(dK);enterDetail(CHAIN[(i+1)%CHAIN.length]);return;}
  stop();render(Math.min(S.length-1,cur+1));});
document.getElementById('prev').addEventListener('click',function(){
  if(mode==='dt'){var i=CHAIN.indexOf(dK);enterDetail(CHAIN[(i-1+CHAIN.length)%CHAIN.length]);return;}
  stop();render(Math.max(0,cur-1));});
document.getElementById('dots').addEventListener('click',function(e){
  var d=e.target.closest('.dot');if(!d)return;stop();render(+d.getAttribute('data-i'));});
document.getElementById('acts').addEventListener('click',function(e){
  var a=e.target.closest('.act');if(!a)return;stop();
  if(mode==='dt')exitDetail();
  var ai=+a.getAttribute('data-a');
  for(var i=0;i<S.length;i++)if(S[i].act===ai){render(i);break;}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&mode==='dt'){exitDetail();return;}
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();document.getElementById('next').click();}
  else if(e.key==='ArrowLeft'){document.getElementById('prev').click();}});
function stop(){if(timer){clearInterval(timer);timer=null;
  var p=document.getElementById('play');p.classList.remove('on');
  p.innerHTML='<span class="zh">▶ 自动播放</span><span class="en">▶ Auto</span>';}}
document.getElementById('play').addEventListener('click',function(){
  if(timer){stop();return;}
  this.classList.add('on');
  this.innerHTML='<span class="zh">⏸ 暂停</span><span class="en">⏸ Pause</span>';
  timer=setInterval(function(){if(cur>=S.length-1){stop();return;}render(cur+1);},9000);});
document.getElementById('zhB').addEventListener('click',function(){setLang('zh');});
document.getElementById('enB').addEventListener('click',function(){setLang('en');});
function setLang(l){body.setAttribute('data-lang',l);
  document.documentElement.setAttribute('lang',l==='zh'?'zh-CN':'en');
  document.getElementById('zhB').classList.toggle('on',l==='zh');
  document.getElementById('enB').classList.toggle('on',l==='en');
  try{localStorage.setItem('cfoExpLang',l);}catch(e){}
  if(typeof fitNarr==='function')fitNarr();}
document.getElementById('moB').addEventListener('click',function(){
  var on=body.getAttribute('data-motion')!=='on';
  body.setAttribute('data-motion',on?'on':'off');this.classList.toggle('on',on);});
document.getElementById('fsB').addEventListener('click',function(){
  if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}
  else if(document.exitFullscreen)document.exitFullscreen();});

var sv=null;try{sv=localStorage.getItem('cfoExpLang');}catch(e){}
setLang(sv==='en'?'en':'zh');
render(0);
})();
</script>
