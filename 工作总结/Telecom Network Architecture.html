<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电信网络架构 · 给 CFO 的动态讲解</title>
<style>
  :root{
    --bg:#f6f0e3; --bg2:#eee5d3;
    --ink:#2f2a22; --mut:#6a6153; --faint:#8b8168;
    --line:rgba(62,52,38,.17);
    --glass:rgba(255,255,255,.66);
    --c-access:#0e7490; --c-agg:#0369a1; --c-bb:#6d28d9; --c-core:#be123c; --c-svc:#047857;
    --gold:#b45309;
    --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(1100px 650px at 18% -8%,#fdfaf2 0%,transparent 62%),
               radial-gradient(900px 600px at 100% 100%,#e9dfc9 0%,transparent 58%),
               linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;
    min-height:100%;overflow-x:hidden;
  }
  body[data-lang="zh"] .en{display:none}
  body[data-lang="en"] .zh{display:none}
  .wrap{max-width:2040px;margin:0 auto;padding:10px 18px 8px;display:flex;flex-direction:column;height:100vh}

  .top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:7px;flex-shrink:0}
  .brand .kick{display:none;font-family:var(--disp);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#1d6a8a;font-weight:600}
  .brand h1{font-size:18px;font-weight:700;margin-top:0}
  .brand h1 b{color:#0c6b8f}
  .tools{display:flex;gap:6px;align-items:center}
  .btn{background:var(--glass);border:1px solid var(--line);color:var(--mut);font-family:inherit;font-size:13px;
       padding:6px 13px;border-radius:9px;cursor:pointer;transition:.16s;backdrop-filter:blur(8px);white-space:nowrap}
  .btn:hover{color:var(--ink);border-color:rgba(62,52,38,.34)}
  .btn.on{background:rgba(3,105,161,.16);border-color:rgba(3,105,161,.5);color:#0b5f80}

  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;flex-shrink:0}
  .act{display:flex;flex-direction:row;gap:7px;align-items:baseline;background:var(--glass);border:1px solid var(--line);
       border-radius:10px;padding:5px 12px;cursor:pointer;transition:.18s;backdrop-filter:blur(8px)}
  .act .pc{font-size:10.5px;color:var(--faint)}
  .subs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;flex-shrink:0;min-height:28px}
  .subs .lab{font-size:12px;color:var(--faint);margin-right:2px}
  .subs button{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);color:var(--mut);
       font-family:inherit;font-size:12.5px;padding:4px 12px;border-radius:16px;cursor:pointer;transition:.15s}
  .subs button .i{font-family:var(--disp);font-size:10.5px;font-weight:700;color:var(--faint)}
  .subs button:hover{color:var(--ink);border-color:rgba(62,52,38,.36)}
  .subs button.done{color:#1e4d63;border-color:rgba(3,105,161,.3)}
  .subs button.on{background:rgba(3,105,161,.16);border-color:rgba(3,105,161,.55);color:#1e4d63;font-weight:600}
  .subs button.on .i{color:#0c6b8f}
  .subs .arr{color:var(--faint);font-size:11px}
  .act .n{font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:var(--faint);font-weight:700}
  .act .t{font-size:14px;font-weight:600;color:var(--mut)}
  .act:hover{border-color:rgba(62,52,38,.34)}
  .act.on{background:linear-gradient(180deg,rgba(3,105,161,.20),rgba(3,105,161,.07));border-color:rgba(3,105,161,.55)}
  .act.on .t{color:#1e4d63}.act.on .n{color:#0c6b8f}
  body[data-mode="dt"] .acts,body[data-mode="dt"] .subs{opacity:.35;pointer-events:none}

  .stage{display:grid;grid-template-columns:1fr 390px;grid-template-rows:minmax(0,1fr);gap:14px;flex:1;min-height:0}
  .scene{position:relative;background:rgba(255,255,255,.58);border:1px solid var(--line);border-radius:18px;
         backdrop-filter:blur(10px);box-shadow:0 1px 3px rgba(62,52,38,.06);overflow:hidden;display:flex;
         height:100%;min-height:0}
  .scene svg{width:100%;height:100%;display:block}

  .narr{background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.6));border:1px solid var(--line);
        border-radius:18px;padding:20px 20px 16px;backdrop-filter:blur(14px);box-shadow:0 1px 3px rgba(62,52,38,.06);
        display:flex;flex-direction:column;overflow-y:auto;height:100%;min-height:0}
  .narr .fit{display:flex;flex-direction:column;min-height:100%}
  body[data-wide="1"] .stage{grid-template-columns:1fr}
  body[data-wide="1"] .narr{display:none}
  .nextbtn{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
        background:linear-gradient(180deg,rgba(3,105,161,.22),rgba(3,105,161,.10));border:1px solid rgba(3,105,161,.5);
        border-radius:11px;padding:9px 13px;color:#1e4d63;font-size:13.5px;transition:.15s}
  .nextbtn:hover{background:rgba(3,105,161,.26)}
  .nextbtn .k{font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:#0c6b8f;font-weight:700;display:block}
  .nextbtn .go{font-size:18px;font-weight:700}
  .pager{font-family:var(--disp);font-size:10.5px;letter-spacing:.12em;color:var(--faint);font-weight:700;margin-left:8px}
  .narr .tag{font-family:var(--disp);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#0c6b8f}
  .narr h2{font-size:21.5px;font-weight:700;line-height:1.4;margin:7px 0 11px}
  .narr .body{font-size:14.5px;color:#413a2e;line-height:1.9}
  .narr .analogy{margin-top:12px;border-left:2px solid var(--gold);background:rgba(180,83,9,.07);
                 padding:9px 13px;border-radius:0 9px 9px 0;font-size:13.5px;color:#66490f}
  .narr .analogy b{color:var(--gold)}
  .narr .stat{margin-top:12px}
  .narr .stat .v{font-family:var(--disp);font-size:21px;font-weight:700;color:#1e4d63}
  .narr .stat .l{font-size:12.5px;color:var(--faint)}
  .narr .cfo{margin-top:auto;padding-top:14px}
  .narr .cfo .h{font-family:var(--disp);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#046c4e;font-weight:700;margin-bottom:6px}
  .narr .cfo .t{font-size:14px;color:#1b4a3b;line-height:1.85;background:rgba(4,120,87,.09);
                border:1px solid rgba(4,120,87,.24);border-radius:11px;padding:11px 13px}
  .narr .cfo .t b{color:#046c4e}
  .hint{margin-top:11px;font-size:13px;color:#0c6b8f;background:rgba(3,105,161,.09);border:1px dashed rgba(3,105,161,.35);
        border-radius:9px;padding:8px 11px;cursor:pointer;transition:.15s}
  .hint:hover{background:rgba(3,105,161,.16)}

  .routes{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .routes button,.chips button{background:var(--glass);border:1px solid var(--line);color:var(--mut);font-family:inherit;
        font-size:12px;padding:6px 12px;border-radius:18px;cursor:pointer;transition:.15s}
  .routes button:hover,.chips button:hover{color:var(--ink);border-color:rgba(62,52,38,.36)}
  .routes button.on{background:rgba(190,18,60,.16);border-color:rgba(190,18,60,.5);color:#9f1239}
  .seg{margin-top:12px;border:1px solid rgba(62,52,38,.19);background:rgba(255,255,255,.66);border-radius:11px;
       padding:10px 12px;min-height:70px}
  .seg .s-n{font-family:var(--disp);font-size:9.5px;letter-spacing:.14em;color:#a8314b;font-weight:700}
  .seg .s-t{font-size:14px;font-weight:600;margin-top:3px}
  .seg .s-d{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.65}

  .costs{margin-top:11px;display:flex;flex-direction:column;gap:6px}
  .crow{display:grid;grid-template-columns:76px 1fr 44px;gap:9px;align-items:center;font-size:12.5px}
  .crow .cl{color:var(--mut);text-align:right}
  .crow .ct{height:9px;border-radius:5px;background:rgba(62,52,38,.11);overflow:hidden}
  .crow .cf{height:100%;border-radius:5px}
  .crow .cv{font-family:var(--disp);font-weight:700;color:#1e4d63;font-size:12.5px}
  .terms{margin-top:11px;display:flex;flex-direction:column;gap:6px}
  .term{display:flex;align-items:center;gap:9px;font-size:13.5px;background:rgba(255,255,255,.6);
        border:1px solid var(--line);border-radius:9px;padding:7px 11px}
  .term .a{color:#2f2a22;font-weight:600;min-width:72px}
  .term .ar{color:var(--faint)}
  .term .b{color:#4338ca;font-family:var(--disp);font-size:12.5px;font-weight:600}

  /* ---- detail (解剖) panel bits ---- */
  .crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--faint);margin-bottom:3px}
  .crumb .c1{cursor:pointer;color:#0c6b8f}
  .crumb .c1:hover{text-decoration:underline}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .chips button.on{background:rgba(3,105,161,.18);border-color:rgba(3,105,161,.55);color:#1e4d63;font-weight:600}
  .pdet{margin-top:12px;border:1px solid rgba(62,52,38,.19);background:rgba(255,255,255,.64);
        border-radius:12px;padding:12px 14px}
  .pdet .pn{font-size:16.5px;font-weight:700}
  .pdet .pt{font-family:var(--disp);font-size:12px;color:#4338ca;font-weight:600;margin-top:2px;letter-spacing:.02em}
  .pdet .pp{font-size:13.8px;color:#473f33;margin-top:9px;line-height:1.8}
  .pdet .pc{font-size:13.5px;color:#1f5142;margin-top:10px;background:rgba(4,120,87,.09);
            border:1px solid rgba(4,120,87,.22);border-radius:9px;padding:9px 11px;line-height:1.75}
  .pdet .pc b{color:#046c4e}

  .uses{margin-top:15px;display:flex;flex-direction:column;gap:7px}
  .use{display:flex;align-items:flex-start;gap:10px;font-size:13.2px;line-height:1.65}
  .use .uk{font-family:var(--disp);font-size:11.5px;font-weight:700;color:#0c6b8f;background:rgba(3,105,161,.10);
           border:1px solid rgba(3,105,161,.26);border-radius:6px;padding:2px 7px;min-width:64px;text-align:center;flex-shrink:0}
  .use .uv{color:var(--mut)}
  .ctl{flex-shrink:0;display:flex;align-items:center;gap:13px;margin-top:8px;flex-wrap:wrap}
  .dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
  .dot{width:25px;height:4px;border-radius:3px;background:rgba(62,52,38,.19);cursor:pointer;transition:.2s}
  .dot:hover{background:rgba(62,52,38,.36)}
  .dot.on{background:linear-gradient(90deg,#0369a1,#6d28d9);box-shadow:0 1px 3px rgba(62,52,38,.28)}
  .dot.done{background:rgba(3,105,161,.4)}
  body[data-mode="dt"] .dots{opacity:.3;pointer-events:none}
  .nav{display:flex;gap:7px;align-items:center}
  .nav .btn{padding:7px 15px;font-size:13.5px}
  .nav .btn.pri{background:linear-gradient(180deg,rgba(3,105,161,.26),rgba(3,105,161,.12));
                border-color:rgba(3,105,161,.5);color:#1e4d63;font-weight:600}
  .nav .btn.back{background:rgba(109,40,217,.18);border-color:rgba(109,40,217,.5);color:#5b21b6;display:none}
  body[data-mode="dt"] .nav .btn.back{display:inline-block}
  body[data-mode="dt"] #play{display:none}
  .count{font-family:var(--disp);font-size:12.5px;color:var(--faint);white-space:nowrap}

  /* ---- svg ---- */
  .tier{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.25,.8,.3,1)}
  .tier.on{opacity:1;transform:none}
  .tier.dim{opacity:.30}
  .hitbox{cursor:pointer}
  .hitbox rect{fill:transparent}
  .hitbox:hover .plusbadge{opacity:1}
  .plusbadge{opacity:0;transition:opacity .25s}
  .lnk{stroke:rgba(62,52,38,.32);stroke-width:1.1;transition:.5s}
  .lnk.hot{stroke:rgba(3,105,161,.5);stroke-width:1.4}
  .lnk.ctl,.lnk.ctl.hot{stroke:rgba(67,56,202,.55);stroke-width:1.2;stroke-dasharray:3 4}
  .lnk.ctl.red,.lnk.ctl.red.hot{stroke:rgba(190,18,60,.5)}
  .tlabel .nm{font-size:16px;font-weight:700;fill:#2f2a22}
  .tlabel .ct{font-size:11.5px;fill:#6f6555}
  .tlabel .tech{font-size:11.5px;fill:#4338ca;font-family:var(--disp);font-weight:600}
  .band{fill:rgba(62,52,38,.045);transition:fill .3s}
  .band.hl{fill:rgba(3,105,161,.075)}
  .costbar{opacity:0;transition:opacity .6s ease,width .9s cubic-bezier(.3,.7,.3,1)}
  .costbar.on{opacity:1}
  .costlab{font-size:15px;font-weight:700;font-family:var(--disp)}
  #trail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
  #pkt{filter:drop-shadow(0 1px 2px rgba(62,52,38,.45))}
  #overview{transition:opacity .45s ease}
  #detail{opacity:0;pointer-events:none;transition:opacity .5s ease}
  body[data-mode="dt"] #overview{opacity:0;pointer-events:none}
  body[data-mode="dt"] #detail{opacity:1;pointer-events:auto}
  #opssite,#orgchart,#opsflow,#c_cost,#c_link,#c_mech,#c_plan,
  #v_stack,#v_matrix,#v_pick{opacity:0;pointer-events:none;transition:opacity .45s ease}
  body[data-view="site"] #opssite,
  body[data-view="org"] #orgchart,
  body[data-view="flow"] #opsflow,
  body[data-view="cost"] #c_cost,
  body[data-view="link"] #c_link,
  body[data-view="mech"] #c_mech,
  body[data-view="plan"] #c_plan,
  body[data-view="vstack"] #v_stack,
  body[data-view="vmatrix"] #v_matrix,
  body[data-view="vpick"] #v_pick{opacity:1;pointer-events:auto}
  body:not([data-view="ov"]) #overview{opacity:0;pointer-events:none}
  body[data-mode="dt"] #opssite,body[data-mode="dt"] #orgchart,body[data-mode="dt"] #opsflow,
  body[data-mode="dt"] #c_cost,body[data-mode="dt"] #c_link,body[data-mode="dt"] #c_mech,
  body[data-mode="dt"] #c_plan,body[data-mode="dt"] #v_stack,body[data-mode="dt"] #v_matrix,
  body[data-mode="dt"] #v_pick{opacity:0;pointer-events:none}
  .opsg{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s cubic-bezier(.25,.8,.3,1)}
  .opsg.on{opacity:1;transform:none}
  .opsg.dim{opacity:.5}
  .opshead{font-size:14.5px;font-weight:700}
  .opsg[data-g="hint"].on{cursor:pointer}
  .dpart{cursor:pointer}
  .dpart .hit{fill:transparent}
  .dpart .glow{opacity:0;transition:opacity .25s}
  .dpart:hover .glow{opacity:.55}
  .dpart.sel .glow{opacity:1}
  .dlab{font-size:12.5px;fill:#3f382d}
  .dlab.t{font-family:var(--disp);font-size:10.5px;fill:#7a7060}
  .dnote{font-size:11px;fill:#6f6555}
  .anim-in{animation:ai .55s cubic-bezier(.25,.8,.3,1) backwards}
  @keyframes ai{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pulse{animation:pl 2.4s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
  .flowdash{stroke-dasharray:6 8;animation:fd 1s linear infinite}
  @keyframes fd{to{stroke-dashoffset:-14}}
  body[data-motion="off"] .pulse,body[data-motion="off"] .flowdash,body[data-motion="off"] .anim-in{animation:none}
  @media (prefers-reduced-motion:reduce){.tier{transition:none}.pulse,.flowdash,.anim-in{animation:none}}
  @media (max-width:1180px){html,body{overflow:auto}.wrap{height:auto;min-height:100vh}.stage{grid-template-columns:1fr}.scene{height:auto;aspect-ratio:1240/880}.narr{height:auto}}
</style>
</head>
<body data-lang="zh" data-motion="on" data-mode="ov">
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="kick">Telecom Network · Explained for the CFO</div>
      <h1><span class="zh">电信网络架构 · <b>五分钟看懂，想多深有多深</b></span><span class="en">The Telecom Network · <b>five minutes, any depth</b></span></h1>
    </div>
    <div class="tools">
      <button class="btn on" id="zhB">中文</button>
      <button class="btn" id="enB">EN</button>
      <button class="btn on" id="moB"><span class="zh">动效</span><span class="en">Motion</span></button>
      <button class="btn" id="wideB"><span class="zh">只看图</span><span class="en">Diagram only</span></button>
      <button class="btn" id="fsB"><span class="zh">全屏</span><span class="en">Full screen</span></button>
    </div>
  </div>

  <div class="acts" id="acts"></div>
  <div class="subs" id="subs"></div>

  <div class="stage">
    <div class="scene">
      <svg id="scene" viewBox="0 0 1240 880" preserveAspectRatio="xMidYMid meet"
           xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
        <defs>
          <linearGradient id="gAccess" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e7490" stop-opacity=".82"/><stop offset="1" stop-color="#0e7490" stop-opacity=".3"/></linearGradient>
          <linearGradient id="gAgg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0369a1" stop-opacity=".82"/><stop offset="1" stop-color="#0369a1" stop-opacity=".3"/></linearGradient>
          <linearGradient id="gBb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d28d9" stop-opacity=".82"/><stop offset="1" stop-color="#6d28d9" stop-opacity=".3"/></linearGradient>
          <linearGradient id="gCore" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#be123c" stop-opacity=".82"/><stop offset="1" stop-color="#be123c" stop-opacity=".3"/></linearGradient>
          <linearGradient id="gSvc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#047857" stop-opacity=".82"/><stop offset="1" stop-color="#047857" stop-opacity=".3"/></linearGradient>
          <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#7a7060"/></marker>
        </defs>
        <g id="overview" transform="translate(0,90)">
          <g id="bands"></g>
          <g id="links"></g>
          <g id="costbars"></g>
          <g id="tiers"></g>
          <polyline id="trail" points=""/>
          <circle id="pkt" r="0" fill="#fff"/>
          <g id="labels"></g>
          <g id="hits"></g>
        </g>
        <g id="detail" transform="translate(0,90)"></g>
        <g id="opssite"></g>
        <g id="orgchart"></g>
        <g id="opsflow"></g>
        <g id="c_cost"></g>
        <g id="c_link"></g>
        <g id="c_mech"></g>
        <g id="c_plan"></g>
        <g id="v_stack"></g>
        <g id="v_matrix"></g>
        <g id="v_pick"></g>
      </svg>
    </div>
    <aside class="narr" id="narr"></aside>
  </div>

  <div class="ctl">
    <div class="nav">
      <button class="btn back" id="back">← <span class="zh">返回全局</span><span class="en">Back</span></button>
      <button class="btn" id="prev">←</button>
      <button class="btn pri" id="next"><span class="zh">下一步 →</span><span class="en">Next →</span></button>
      <button class="btn" id="play"><span class="zh">▶ 自动播放</span><span class="en">▶ Auto</span></button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="count" id="count"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var body=document.body, NS='http://www.w3.org/2000/svg';
function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
function mk(tag,cls,txt){var e=document.createElementNS(NS,tag);if(cls)e.setAttribute('class',cls);e.textContent=txt;return e;}
function q(s){return document.querySelectorAll(s);}
function L(o){return o?'<span class="zh">'+o.zh+'</span><span class="en">'+o.en+'</span>':'';}
/* bilingual svg text */
function T(x,y,o,cls,anchor,size,fill){
  var t=el('text',{x:x,y:y,class:cls||'dlab'});
  if(anchor)t.setAttribute('text-anchor',anchor);
  if(size)t.setAttribute('font-size',size);
  if(fill)t.setAttribute('fill',fill);
  if(typeof o==='string'){t.textContent=o;}
  else{var a=mk('tspan','zh',o.zh);a.setAttribute('x',x);var b=mk('tspan','en',o.en);b.setAttribute('x',x);
       t.appendChild(a);t.appendChild(b);}
  return t;

 order:['aau','bbu','tower','power','batt','trans','grid','spec','onu','splitter','olt'],
 parts:{
  aau:{nm:{zh:'天线（AAU / RRU）',en:'Antenna (AAU / RRU)'},tech:'Active Antenna Unit · 有源天线单元',
   p:{zh:'塔顶那几块"板子"。它负责<b>把信号发出去、把信号收回来</b>——手机能不能连上、信号强不强，第一决定因素就是它朝哪儿、有多高。一个站通常 3 面天线，各覆盖 120°，合起来是一圈。',
      en:'The panels on top. They <b>transmit and receive</b> — whether your phone connects at all is decided here. Usually three per site, 120° each.'},
   c:{zh:'5G 的 AAU 比 4G 天线<b>更重、更费电</b>（内含 32/64 通道 Massive MIMO）。它是站点电费上升的主因，也是"节能关断"这个杠杆作用的对象。',
      en:'A 5G AAU is <b>heavier and hungrier</b> than 4G (32/64-channel Massive MIMO). It is why site power rose — and the thing AI power-saving switches off.'}},
  bbu:{nm:{zh:'BBU 基带单元',en:'BBU baseband unit'},tech:'BaseBand Unit · 基带处理',
   p:{zh:'柜子里那台"电脑"，负责<b>把无线信号编解码、调度谁先发谁后发</b>。天线管收发，BBU 管计算，中间一根光纤连起来。',
      en:'The computer in the cabinet: it <b>encodes, decodes and schedules</b>. The antenna transmits, the BBU thinks, a fiber joins them.'},
   c:{zh:'BBU 可以<b>从每个站里搬走、集中到一个机房</b>（C-RAN）——省机房、省空调、省电，是接入层少数"结构性"降本手段。',
      en:'BBUs can be <b>pulled out of every site and pooled</b> (C-RAN) — fewer rooms, less cooling, less power. One of the few structural savings at the edge.'}},
  tower:{nm:{zh:'铁塔与站址',en:'Tower & site'},tech:'Tower / mast / rooftop',
   p:{zh:'塔（或楼顶抱杆）＋这块地/这个屋顶的<b>使用权</b>。天线要高才能覆盖远，所以塔越高越好，但也越贵。',
      en:'The tower (or rooftop mast) plus the <b>right to occupy</b> that ground or roof. Higher reaches further — and costs more.'},
   c:{zh:'塔和站址通常是<b>租的</b>，一签就是十年。<b>站址租金是接入层第一大成本</b>，也是"共建共享 / 塔公司"这个杠杆的着力点。',
      en:'Towers and sites are usually <b>leased for ten years</b>. <b>Site rent is the single largest access cost</b> — the target of tower sharing.'}},
  power:{nm:{zh:'电源与整流',en:'Power & rectifier'},tech:'Rectifier / DC plant',
   p:{zh:'把市电（交流）转成设备要的直流电，并给电池充电。基站是<b>7×24 不能断电</b>的设备。',
      en:'Converts mains AC to the DC the radios need, and charges the batteries. A site <b>must never lose power</b>.'},
   c:{zh:'<b>电费是接入层第二大成本</b>，仅次于站租。一个站一年的电费，往往和它的租金是同一量级。',
      en:'<b>Power is the second largest access cost</b> after rent — often the same order of magnitude per site per year.'}},
  batt:{nm:{zh:'蓄电池组',en:'Battery bank'},tech:'Backup battery · 备电',
   p:{zh:'停电时顶上去的<b>最后一道防线</b>，一般能撑 2–4 小时。撑过这段时间，抢修车还没到，这个站就"掉"了。',
      en:'The <b>last line of defence</b> in an outage — typically 2–4 hours. If the crew does not arrive in time, the site goes dark.'},
   c:{zh:'电池会老化，<b>标称 4 小时的旧电池实际可能只有 40 分钟</b>。"掉站"故障里很大一部分根因在这里——电池更换是一笔常被低估的周期性支出。',
      en:'Batteries age — a "4-hour" old bank may deliver 40 minutes. A large share of site outages trace here; replacement is an underestimated recurring cost.'}},
  trans:{nm:{zh:'传输接入设备',en:'Backhaul equipment'},tech:'CSG (IPRAN/PTN) / Microwave',
   p:{zh:'把这个基站<b>接到网络里去</b>的设备——用光纤，或者（偏远站）用微波对传。没有它，基站就是个孤岛。',
      en:'The box that <b>connects this site to the network</b> — over fiber, or microwave for remote sites. Without it the site is an island.'},
   c:{zh:'光纤 = 一次性建设费；微波 = 没有挖沟成本但<b>月月付频率费和维护</b>。<b>长期占用的站点改光纤，是省钱的；短期站点用微波更划算。</b>',
      en:'Fiber is capex once; microwave avoids trenching but <b>bills monthly</b>. Long-tenure sites should go fiber; short-tenure sites stay microwave.'}},
  grid:{nm:{zh:'市电接入 / 油机',en:'Mains supply / genset'},tech:'Grid / diesel generator',
   p:{zh:'站点的"外部供电"。城市里接市电；偏远、电网不稳的地方要配<b>柴油发电机</b>，还得定期有人开车去加油。',
      en:'External supply. Cities use the grid; remote or unstable areas need a <b>diesel generator</b> — and someone driving out to refuel it.'},
   c:{zh:'油机站是<b>成本黑洞</b>：油费 + 每次加油的出车费 + 被偷油的损耗。这类站点是"太阳能 / 储能改造"优先算账的对象。',
      en:'Genset sites are a <b>cost sink</b>: fuel, the truck-roll to refuel, and theft. These are the first candidates for solar and storage.'}},
  spec:{nm:{zh:'频谱（牌照）',en:'Spectrum licence'},tech:'800M / 1.8G / 2.1G / 2.6G / 3.5G …',
   p:{zh:'看不见、摸不着，但没有它这座塔一点用都没有——<b>它是政府批给你使用某段无线电频率的权利</b>。低频传得远（覆盖广），高频容量大（速度快）。',
      en:'Invisible, but without it the tower is useless — <b>the right to use a slice of radio frequency</b>. Low bands travel far; high bands carry more.'},
   c:{zh:'频谱是<b>前置一次性付费、然后逐年摊销</b>的资产，通常在 capex 里单列。<b>买了却没充分利用的频谱，是最安静的浪费。</b>',
      en:'Spectrum is <b>paid upfront and amortized</b>, usually its own capex line. <b>Bought-but-underused spectrum is the quietest waste on the books.</b>'}},
  onu:{nm:{zh:'光猫 ONU / ONT',en:'Home modem (ONU/ONT)'},tech:'Optical Network Unit',
   p:{zh:'装在用户家里的那个小盒子，把<b>光信号转成家里的网线 / WiFi</b>。固网这条腿的"最后一米"。',
      en:'The small box in the home that turns <b>light into ethernet and WiFi</b> — the last metre of the fixed leg.'},
   c:{zh:'光猫通常<b>运营商免费送、计入获客成本</b>。数量以百万计，是一笔容易被忽略的终端补贴支出。',
      en:'Usually <b>given away and booked as acquisition cost</b>. At millions of units, an easily overlooked subsidy line.'}},
  splitter:{nm:{zh:'光分路器',en:'Optical splitter'},tech:'POS · Passive Optical Splitter',
   p:{zh:'一个<b>完全不用电</b>的小器件，把一根光纤"劈"成 32～64 路，分给一栋楼的住户共用。这就是 PON（无源光网络）省钱的原理。',
      en:'A <b>completely passive</b> device that splits one fiber into 32–64, shared by a building. This is why PON is cheap.'},
   c:{zh:'"无源"＝不耗电、几乎不坏、不用维护。<b>固网接入的单户成本远低于移动</b>，这是固网宽带毛利结构好于移动的根本原因之一。',
      en:'Passive means no power, no maintenance. <b>Cost per fixed subscriber is far below mobile</b> — a structural reason fixed margins look better.'}},
  olt:{nm:{zh:'OLT 光线路终端',en:'OLT'},tech:'Optical Line Terminal',
   p:{zh:'放在局端机房的设备，<b>一台 OLT 管着成千上万户</b>的光纤接入，往上接到城域网。',
      en:'Sits in the local exchange; <b>one OLT serves thousands of homes</b> and hands them up to the metro network.'},
   c:{zh:'OLT 是固网接入的<b>集中点</b>——单台投入不小，但摊到每户很低，且<b>扩容只需插板卡</b>，边际成本递减明显。',
      en:'The <b>concentration point</b> of fixed access: costly per box, cheap per home, and expanded by <b>adding cards</b> — strongly decreasing marginal cost.'}}
 }},

 parts:{

   p:{zh:'每个基站接进回传网的<b>第一个路由设备</b>。它把这个站的流量打上标签，送进环网。',
      en:'The <b>first router</b> a site meets. It tags the site\'s traffic and puts it on the ring.'},
   c:{zh:'数量 ≈ 基站数量，所以<b>它的单价要乘以几千</b>（按 5,500 站测算）。这类"每站一台"的设备，采购议价的杠杆最大。',
      en:'Its count equals the site count, so <b>unit price multiplies by thousands</b> (5,500 sites here) — the highest-leverage procurement item.'}},
  ring:{nm:{zh:'环形组网',en:'Ring topology'},tech:'Access / aggregation ring',
   p:{zh:'为什么绕一圈而不是拉直线？因为<b>环上任何一处断了，流量能从反方向绕回去</b>，用户不断网。这是电信网和普通企业网最大的区别之一。',
      en:'Why a ring rather than a line? Because <b>a break anywhere reroutes the other way</b> and users stay online. This is what separates carrier networks from enterprise ones.'},
   c:{zh:'环 = <b>用多一倍的光纤，换 99.99% 的可用性</b>。这笔钱不是浪费，是买保险；砍掉它，省下的远小于一次大面积断网的代价。',
      en:'A ring <b>spends double the fiber to buy 99.99% availability</b>. Not waste — insurance. Cutting it saves far less than one major outage costs.'}},
  aggnode:{nm:{zh:'汇聚机房',en:'Aggregation site'},tech:'Aggregation node',
   p:{zh:'区域级的机房，<b>把周边几十上百个基站的流量汇总</b>，再统一往上送到骨干 PE。有空调、有备电。',
      en:'A district-level room that <b>gathers dozens or hundreds of sites</b> and hands them upward. It has cooling and backup power.'},
   c:{zh:'按 5,500 站测算约 <b>16 个区域汇聚机房 ＋ 约 120 个综合接入机房</b>——比核心机房多得多、比基站少得多。机房租赁与能耗在这一层开始规模化，是"机房整合退租"的主要对象。',
      en:'At 5,500 sites: about <b>16 regional aggregation rooms plus ~120 access rooms</b> — far more than core rooms, far fewer than cell sites. Where room rent and energy start to scale, and where consolidation pays.'}},
  conv:{nm:{zh:'收敛比',en:'Concentration ratio'},tech:'Oversubscription',
   p:{zh:'不是每个用户都同时用满带宽，所以上层带宽<b>远小于所有用户带宽之和</b>。一千个基站的流量，可能只需要一条不到十分之一的上联。',
      en:'Not everyone uses full speed at once, so upstream capacity is <b>far less than the sum of all users</b>. A thousand sites may need under a tenth of their nominal total.'},
   c:{zh:'收敛比是<b>成本与体验之间的旋钮</b>：调高省钱但高峰卡顿，调低体验好但带宽费高。<b>它是个可以量化讨论的商业决策，不是纯技术问题。</b>',
      en:'It is the <b>dial between cost and experience</b>: higher saves money but congests at peak. <b>A quantifiable business decision, not a purely technical one.</b>'}},
  bras:{nm:{zh:'BNG 宽带网关（旧称 BRAS）',en:'BNG (formerly BRAS)'},tech:'Broadband Network Gateway',
   p:{zh:'固网宽带的<b>总闸门</b>：你家宽带拨号上来，在这里被认证"是不是交了钱"、被限速到你买的档位、被记下用了多少流量。',
      en:'The <b>gate</b> of fixed broadband: it authenticates your line, enforces the speed you paid for, and meters your usage.'},
   c:{zh:'它<b>物理上在城域，功能上就是固网的"核心网"</b>；认证时去核心机房的 AAA 查账户（总览里那条红色虚线）。它同时是<b>计费的采集点</b>——BNG 记录不准，账就出错，收入保障（RA）对账必查。',
      en:'It <b>sits in the metro but plays the fixed-line core role</b>, checking accounts against the AAA in the core room (the red dashed line in the overview). It is also a <b>billing collection point</b> — if its records drift, bills are wrong.'}}
 }},

       en:'This layer is really <b>two networks stacked</b>: a router network that reads packets, over an optical network that carries light. <b>Routers ride on fiber.</b>'},
 link:{zh:'总览里 PE → P → P → PE 那一排路由器，以及它们脚下那张光纤网（画在底座里）。',

 order:['pe','p','otn','wave','dual'],
 parts:{
  pe:{nm:{zh:'边缘路由器 PE',en:'Provider edge router (PE)'},tech:'PE · Provider Edge · IP/MPLS',
   p:{zh:'骨干网的<b>出入口</b>：城域网、核心机房、互联网出口都经 PE 接进骨干。它给不同业务打上"标签"（MPLS VPN），让<b>移动回传、家宽、政企专线在同一张网里互不干扰</b>。',
      en:'The <b>on- and off-ramps</b> of the backbone: metro networks, core rooms and the internet gateway all attach through PEs. It labels each service (MPLS VPN) so <b>mobile, broadband and enterprise traffic share one network without mixing</b>.'},
   c:{zh:'按大区与核心机房成对布放，按 5,500 站规模约<b>数十台</b>。设备贵但数量可控——采购集中度高，适合整体框架协议议价。',
      en:'Deployed in pairs per region and core room — <b>a few dozen</b> at 5,500 sites. Expensive but countable — well suited to framework-agreement pricing.'}},
  p:{nm:{zh:'核心路由器 P',en:'Provider core router (P)'},tech:'P · Provider router',
   p:{zh:'骨干上<b>吞吐量最大、只管高速转发</b>的设备，不理会业务内容。<b>成对部署</b>，任何一台故障，另一台接管。',
      en:'The <b>highest-throughput</b> boxes on the backbone — they only forward, never inspect services. <b>Deployed in pairs</b>, so either can carry the load.'},
   c:{zh:'单价极高、全网<b>个位数到十几台</b>。这类设备的策略是"少而精 + 冗余"，不能靠削数量省钱，只能靠延长生命周期和许可谈判。',
      en:'Very expensive, <b>a handful to a dozen</b> network-wide. You cannot save by cutting count — only by extending life and negotiating licences.'}},
  otn:{nm:{zh:'光传送设备 OTN',en:'Optical transport (OTN)'},tech:'OTN / DWDM',
   p:{zh:'它<b>不看数据内容，只管把光送到对面</b>。把路由器发出的信号变成特定颜色（波长）的光，塞进同一根光纤里传走。',
      en:'It <b>ignores content and just moves light</b> — turning router signals into a coloured wavelength and pushing it down the shared fiber.'},
   c:{zh:'典型的<b>重资产、长周期</b>：一次建设用十五年，折旧是报表上的固定项。好消息是<b>扩容便宜</b>——见"波分复用"。',
      en:'Classic <b>heavy, long-lived asset</b>: built once for fifteen years, depreciation is a fixed line. The good news is cheap expansion — see wavelengths.'}},
  wave:{nm:{zh:'波分复用（扩容的秘密）',en:'Wavelength multiplexing'},tech:'DWDM · Dense Wavelength Division',
   p:{zh:'同一根光纤里，可以<b>同时跑几十种不同"颜色"的光</b>，互不干扰。要扩容不必再挖一条光缆——<b>点亮一个新波长就行</b>。',
      en:'One fiber carries <b>dozens of different "colours" of light</b> at once without interference. Expansion does not need new cable — <b>just light up another wavelength</b>.'},
   c:{zh:'这是<b>整个网络里边际成本最低的扩容方式</b>。所以传输带宽的单价会逐年下降——签长期带宽合同时，要注意价格下行趋势。',
      en:'The <b>cheapest marginal expansion in the whole network</b>. Unit bandwidth prices therefore fall every year — worth remembering before signing long bandwidth contracts.'}},
  dual:{nm:{zh:'双路由保护',en:'Dual routing'},tech:'Diverse path protection',
   p:{zh:'重要的线路会<b>走两条物理上完全不同的路径</b>——不同的街道、不同的桥。挖断一条，另一条毫秒级顶上。',
      en:'Important circuits take <b>two physically separate paths</b> — different streets, different bridges. Cut one and the other takes over in milliseconds.'},
   c:{zh:'企业客户<b>愿意为这个额外付钱</b>：双路由是专线 SLA 的卖点。所以它既是成本项，也是 B2B 的溢价来源。',
      en:'Enterprise customers <b>pay extra for it</b>: diverse routing is the selling point of a leased-line SLA. A cost, but also a B2B premium.'}}
 }},

/* ---------- 核心网 ---------- */
core:{
 lead:{zh:'核心网<b>几乎全是软件</b>——没有天线、没有光缆，跑在核心机房的服务器（电信云）上。它分成两半：<b>管调度的（控制面）</b>和<b>真正搬数据的（用户面）</b>。',
       en:'The core is <b>almost entirely software</b> — no antennas, no cable, running on servers (telco cloud) in the core rooms. It splits in two: <b>the part that decides</b> and <b>the part that carries</b>.'},
 link:{zh:'总览里 EPC/5GC 与 IMS·CS 两个方块，拆开就是下面这些网元（AAA 属固网，见城域网 BNG）。',

 },
 order:['amf','udm','smf','upf','pcf','ims','edge','charge'],
 parts:{
  amf:{nm:{zh:'AMF 接入与移动管理',en:'AMF — access & mobility'},tech:'Access and Mobility Management Function',
   p:{zh:'网络的<b>前台登记处</b>。你一开机，它记下"这个用户来了、现在在哪个基站下面"；你走动换基站，也是它负责交接。',
      en:'The <b>front desk</b>. When you power on it notes who you are and which site you are under; as you move, it hands you over.'},
   c:{zh:'4G 里叫 MME。它只处理信令、<b>不碰用户数据</b>，所以对带宽要求小、对可靠性要求极高——它挂了，谁都登不上网。',
      en:'Called MME in 4G. It handles signalling only, <b>never user data</b> — light on bandwidth, extreme on reliability. If it fails, nobody can attach.'}},
  udm:{nm:{zh:'UDM / HSS 用户数据管理',en:'UDM / HSS — subscriber data'},tech:'Unified Data Management',
   p:{zh:'全网的<b>户口本</b>：每个号码是谁、买了什么套餐、有没有开通国际漫游、欠不欠费。所有鉴权都要来查它。',
      en:'The <b>register of record</b>: who each number is, what plan they bought, whether roaming is on, whether they owe money. Every authentication checks here.'},
   c:{zh:'它是<b>用户资产的数据底账</b>，直接关系计费正确性。<b>UDM 和 BSS 的数据不一致，就会产生收入泄漏</b>——收入保障对账的第一个对象。',
      en:'The <b>ledger of the subscriber base</b>, directly tied to billing accuracy. <b>Mismatch between UDM and BSS becomes revenue leakage</b> — the first thing revenue assurance reconciles.'}},
  smf:{nm:{zh:'SMF 会话管理',en:'SMF — session management'},tech:'Session Management Function',
   p:{zh:'<b>调度员</b>。你要上网，它负责给你分配 IP 地址、建立一条数据通道，并指定由哪台 UPF 来搬你的数据。',
      en:'The <b>dispatcher</b>. It assigns your IP, sets up the data path, and picks which UPF will carry your traffic.'},
   c:{zh:'4G 里这部分功能在 SGW/PGW 里。<b>5G 把"决策"和"搬运"拆开</b>，才让 UPF 可以灵活下沉到边缘——这是 5G 架构最有商业含义的一处改动。',
      en:'In 4G this lived inside SGW/PGW. <b>5G split deciding from carrying</b>, which is what lets UPF move to the edge — the most commercially meaningful change in the architecture.'}},
  upf:{nm:{zh:'UPF 用户面功能',en:'UPF — user plane function'},tech:'User Plane Function',
   p:{zh:'<b>真正搬数据的那一台</b>。你刷的每一帧视频、发的每一条消息，都从 UPF 过。它也在这里<b>数你用了多少流量</b>。',
      en:'The one that <b>actually moves the bytes</b>. Every video frame and message passes through UPF — and it <b>counts your usage</b> here.'},
   c:{zh:'全网流量都压在它身上，所以<b>它的容量直接决定要买多少服务器</b>。流量涨 → UPF 扩容，这是核心网里<b>最直接随流量增长</b>的成本项。',
      en:'All traffic lands on it, so <b>its capacity sets how many servers you buy</b>. Traffic grows, UPF grows — the core cost most directly tied to traffic.'}},
  pcf:{nm:{zh:'PCF 策略控制',en:'PCF — policy control'},tech:'Policy Control Function',
   p:{zh:'<b>规则引擎</b>：这个用户限速多少、看视频算不算免流量、超出套餐后降速还是断网——都是它说了算。',
      en:'The <b>rules engine</b>: what speed this user gets, whether this video counts against the quota, what happens after the bundle runs out.'},
   c:{zh:'它是<b>把套餐设计变成网络行为的地方</b>。市场部想做的任何差异化套餐（定向免流、限速档位），最终都要 PCF 能配得出来。',
      en:'Where <b>tariff design becomes network behaviour</b>. Any differentiated plan marketing dreams up must be expressible here.'}},
  ims:{nm:{zh:'话音核心 IMS ＋ CS',en:'Voice core — IMS + CS'},tech:'IMS · VoLTE / VoNR ｜ CS · MSC（2G/3G）',
   p:{zh:'专门<b>管"打电话"</b>的那一套。4G/5G 时代语音也是走数据网的，但需要 IMS 来保证接通、保证音质、保证能打 112 急救电话。<b>2G/3G 的电话仍走老的电路域（CS，核心是 MSC）</b>，所以现在是两套并存。',
      en:'The stack that <b>handles calls</b>. In 4G/5G voice also rides the data network, but IMS guarantees setup, quality and emergency calling. <b>2G/3G calls still use the legacy circuit-switched core (MSC)</b>, so both run side by side today.'},
   c:{zh:'话音收入在下降，但 IMS <b>不能不建</b>——它是牌照义务（紧急呼叫）和互联结算的必要条件。属于"收入不涨但必须维持"的成本。<b>2G/3G 退网后 CS 才能关掉</b>——那是话音侧唯一的结构性省钱机会。',
      en:'Voice revenue is falling, but IMS <b>cannot be skipped</b> — emergency calling is a licence obligation and interconnect depends on it. A must-keep cost with flat revenue. <b>Only a 2G/3G sunset lets the CS core be switched off</b> — the one structural saving on voice.'}},
  edge:{nm:{zh:'UPF 下沉 / 边缘计算',en:'Edge UPF / MEC'},tech:'MEC · Multi-access Edge Computing',
   p:{zh:'把"搬数据"的那台 UPF <b>从核心机房搬到离用户更近的区域机房</b>（比如工业园区旁边），数据不用跑那么远，时延大幅下降。',
      en:'Move the UPF <b>from the capital out to where users are</b> — beside an industrial park, say. Data travels less, latency drops sharply.'},
   c:{zh:'这是<b>面向 B2B 的收入机会</b>（工厂、港口、矿山的低时延专网），同时还能<b>省回传带宽</b>——本地流量不必再拉到核心机房绕一圈。',
      en:'A <b>B2B revenue opening</b> (low-latency private networks for factories, ports, mines) that also <b>saves backhaul</b> — local traffic no longer detours to the core rooms.'}},
  charge:{nm:{zh:'计费触点 / 话单',en:'Charging touchpoint / xDR'},tech:'CHF / OCS · xDR',
   p:{zh:'你每用一次网络，核心网就<b>产生一条记录（话单）</b>：谁、什么时候、用了多久或多少流量。这些记录送到计费系统，才变成账单。',
      en:'Every time you use the network, the core <b>writes a record</b>: who, when, how long, how much. Those records become bills downstream.'},
   c:{zh:'<b>这是网络和钱的接缝处。</b>话单漏一条，收入就少一笔；话单错一条，就可能引发投诉或对端争议。<b>网络侧最靠近收入的一个点，就在这里。</b>',
      en:'<b>This is the seam between network and money.</b> A lost record is lost revenue; a wrong one is a dispute. <b>The closest the network ever gets to the top line.</b>'}}
 }},

 order:['ocs','billing','crm','ra','gw','peer','roam','cdn','egress','fw'],
 parts:{
  ocs:{nm:{zh:'计费引擎 OCS',en:'Charging engine (OCS)'},tech:'Online Charging System',
   p:{zh:'预付费用户<b>边用边扣</b>的那套系统：每几秒判断一次"余额还够不够、要不要切断"。实时性要求极高。',
      en:'The system that <b>debits as you use</b> for prepaid — every few seconds it decides whether the balance still covers the session.'},
   c:{zh:'预付费为主的市场，OCS 就是<b>现金流的闸门</b>。它慢一点、错一点，直接体现在当期收入上。',
      en:'In a prepaid-heavy market OCS is the <b>valve on cash flow</b>; any lag or error shows up in the period revenue.'}},
  billing:{nm:{zh:'账务与出账',en:'Billing & invoicing'},tech:'Billing / invoicing',
   p:{zh:'后付费用户<b>月底算总账</b>：汇总这个月所有话单、套上资费、生成账单发出去，再跟进催收。',
      en:'For postpaid, the <b>month-end run</b>: aggregate records, apply tariffs, issue invoices, chase payment.'},
   c:{zh:'出账是<b>有截止日的生产作业</b>——一次跑批失败可能延迟整月账单，它的稳定性是财务闭账的前置条件。',
      en:'A <b>production job with a hard deadline</b> — one failed run delays a month of invoices, and with it the close.'}},
  crm:{nm:{zh:'CRM 与客服',en:'CRM & customer care'},tech:'Customer Relationship Management',
   p:{zh:'开户、换套餐、投诉、营业厅和 App 背后的系统。<b>用户感知到的"运营商"，其实大多是这一层。</b>',
      en:'Onboarding, plan changes, complaints, the shop and the app. <b>What customers experience as the operator is mostly this.</b>'},
   c:{zh:'人力密集，是<b>自助化与 RPA 最先见效的地方</b>：开卡、改套餐、查账单自助化，直接减客服编制。',
      en:'Labour-intensive and the <b>first place self-service pays</b> — activation, plan changes and bill queries cut headcount directly.'}},
  ra:{nm:{zh:'收入保障 RA',en:'Revenue assurance'},tech:'Revenue Assurance',
   p:{zh:'专门<b>查"钱有没有漏"</b>：把网络侧记录、计费系统记录、财务账三边对上。对不上的差额，就是漏掉的收入。',
      en:'The function that <b>hunts for leaks</b> — reconciling network records, charging records and the ledger. Gaps are lost revenue.'},
   c:{zh:'行业里未经治理的泄漏通常在<b>收入的 1–3%</b>。<b>这是离收入最近、见效最快的一根杠杆</b>——不用动网络，只要把账对上。',
      en:'Untreated leakage typically runs <b>1–3% of revenue</b>. <b>The closest and fastest lever</b> — no network change, just reconciliation.'}},
  gw:{nm:{zh:'国际关口局',en:'International gateway'},tech:'ISC 国际交换 · SBC 互联边界 · STP / DEA 信令网关',
   p:{zh:'本国网络与外国网络之间的<b>海关</b>。国际长途、跨境短信、国际数据，都要从这道关口进出；它还负责不同运营商之间的协议对接和号码翻译。',
      en:'The <b>customs post</b> between this country network and foreign ones. International calls, SMS and data all pass here, with protocol and numbering translation.'},
   c:{zh:'关口局是<b>国际结算的计量点</b>——出去多少分钟、进来多少分钟都在这里记账。它同时是监管落地的地方（国际话务管控），属于<b>必须有、不能省</b>的一类资产。',
      en:'It is the <b>metering point for international settlement</b>, and where regulatory obligations land. A must-have asset, not a candidate for cuts.'}},
  peer:{nm:{zh:'其他运营商互联',en:'Interconnect with other operators'},tech:'Interconnect / Peering · 网间互联',
   p:{zh:'你的用户打给别家运营商的用户、访问别家网络的内容，都要走网间互联。<b>任何一家运营商都必须和同行互联，否则"打不通"</b>——这是牌照义务，也是生意的前提。',
      en:'Calls and traffic to other operators cross here. <b>Every operator must interconnect, or calls simply fail</b> — a licence obligation and a business precondition.'},
   c:{zh:'网间结算是<b>双向现金流</b>：别人打进来你收钱，你打出去要付钱。<b>话单质量直接决定对账时的谈判地位</b>——差错就是净损失。',
      en:'Settlement is a <b>two-way cash flow</b>: inbound earns, outbound pays. <b>Record quality is your bargaining position</b> — errors are a net loss.'}},
  roam:{nm:{zh:'漫游合作方',en:'Roaming partners'},tech:'Roaming agreements · IPX / GRX',
   p:{zh:'用户出国后用的是外国运营商的网，但账还记在你这里；外国用户来也一样。靠的是运营商之间<b>预先签好的漫游协议</b>。',
      en:'Abroad, your users ride a foreign network but are billed by you — and vice versa. It runs on <b>pre-negotiated roaming agreements</b>.'},
   c:{zh:'漫游是<b>高毛利但强议价</b>的业务，批发价全靠双边协议谈。<b>对跨境人流大的市场，协议谈得好不好直接体现在毛利上。</b>',
      en:'Roaming is <b>high-margin but heavily negotiated</b> — wholesale rates come from bilateral deals. In markets with heavy cross-border traffic, the deal is the margin.'}},
  cdn:{nm:{zh:'本地 CDN 缓存',en:'Local CDN cache'},tech:'Content Delivery Network',
   p:{zh:'把最热门的视频、App 更新包<b>提前存一份在本国机房</b>。用户再看时就近取，不用每次跨境去源站拉。',
      en:'Keep the most popular video and app updates <b>inside the country</b>, so users fetch locally instead of crossing the border each time.'},
   c:{zh:'对内陆国家这是<b>最直接的出口带宽节省手段</b>——命中率每提高一点，国际带宽费就少一点。投入小、回报快。',
      en:'For a landlocked country the <b>most direct saving on egress</b> — every point of cache-hit rate is money off the international bill.'}},
  egress:{nm:{zh:'互联网出口',en:'Internet egress'},tech:'IGW · IP Transit / Peering',
   p:{zh:'本国网络通向<b>公众互联网</b>的那扇门。访问国外网站的流量从这里出去，按带宽向上游付费。',
      en:'The door to the <b>public internet</b>. Traffic to foreign sites exits here, paid for by bandwidth.'},
   c:{zh:'对<b>内陆国家</b>这是最贵的一段——要借道邻国。<b>议价能力和多路由直接决定这条成本线。</b>',
      en:'For a <b>landlocked country</b> this is the priciest hop, transiting neighbours. <b>Bargaining power and multi-routing set this cost line.</b>'}},
  fw:{nm:{zh:'安全与防火墙',en:'Security & firewall'},tech:'Firewall / DDoS / compliance',
   p:{zh:'挡住攻击（尤其是 DDoS 大流量攻击）、满足监管合规要求。<b>它不产生收入，但它出事会让所有收入停摆。</b>',
      en:'Blocks attacks (especially volumetric DDoS) and meets regulatory obligations. <b>It earns nothing, but its failure stops everything.</b>'},
   c:{zh:'典型的<b>保险型支出</b>：很难论证 ROI，但一次大规模攻击或一次合规处罚的代价，通常远高于常年投入。',
      en:'Classic <b>insurance spend</b>: hard to justify by ROI, yet one major attack or penalty costs more than years of it.'}}
 }},

 order:['ems','fm','pm','cm','noc','ticket','auto','plan'],
 parts:{
  ems:{nm:{zh:'网管 EMS / NMS',en:'Element / Network Management'},tech:'EMS · NMS · 综合网管',
   p:{zh:'每个厂商的设备都自带一套网管（EMS），上面再叠一层综合网管（NMS）把多厂商的网统一看起来。<b>所有设备的告警、性能、配置，都从这里采上来。</b>',
      en:'Each vendor ships its own element manager (EMS); an umbrella NMS unifies a multi-vendor network. <b>Every alarm, metric and config comes up through here.</b>'},
   c:{zh:'网管<b>按网元数量和厂商数量买许可</b>。多一个厂商就多一套网管、多一份许可、多一套技能——<b>厂商收敛省下的不只是设备价，还有这一层的长期成本。</b>',
      en:'Licensed <b>by element count and vendor count</b>. Each extra vendor means another manager, licence and skill set — <b>vendor consolidation saves more than equipment price.</b>'}},
  fm:{nm:{zh:'告警管理 FM',en:'Fault management (FM)'},tech:'Fault Management · 故障管理',
   p:{zh:'设备一出问题就上报告警。一张全国网每天<b>几万到几十万条</b>，其中绝大多数会自动恢复，或者是同一个根因引发的连锁反应。FM 负责收敛、去重、定级。',
      en:'Devices raise alarms constantly — <b>tens to hundreds of thousands a day</b> nationwide, most self-clearing or echoes of one root cause. FM compresses, de-duplicates and ranks them.'},
   c:{zh:'告警收敛率直接决定 NOC 要配多少人。<b>收敛做得好，几十万条能压到几百条真问题</b>——这是 AIOps 投入里回报最清楚的一块。',
      en:'Compression ratio decides NOC headcount. <b>Done well, hundreds of thousands collapse into hundreds of real problems</b> — the clearest payback in AIOps.'}},
  pm:{nm:{zh:'性能管理 PM',en:'Performance management (PM)'},tech:'Performance Management · KPI',
   p:{zh:'持续采集每个网元的指标——掉话率、接通率、吞吐、时延、利用率，形成 KPI 报表。<b>"网好不好"不是靠感觉，是靠这些数。</b>',
      en:'Continuously collects per-element metrics — drop rate, setup success, throughput, latency, utilisation. <b>Network quality is a number, not an impression.</b>'},
   c:{zh:'PM 数据是<b>扩容决策的依据</b>：哪个小区忙、哪条链路快满了。没有 PM，扩容就变成拍脑袋——要么过度投资，要么用户投诉。',

       en:'It <b>concentrates</b> every site and home in a region and hands them to the backbone. Two legs: mobile sites ride the <b>backhaul</b> (IPRAN/PTN); home broadband goes through the <b>BNG</b>, which physically sits here but does the fixed-line core job.<br><br>Both legs increasingly <b>share one IP metro network</b>.'},

      en:'This layer decides <b>whether bandwidth is enough</b>. Growth congests here first.'}});
step({act:0,show:['access','agg','bb'],hl:'bb',open:'bb',title:{zh:'第 3 层 · 骨干承载网：全国的高速公路',en:'Layer 3 · Backbone: the motorways'},
 body:{zh:'连接各大区与核心机房的<b>全国主干</b>。图上是路由器：<b>PE</b> 是出入口，<b>P</b> 是只管高速转发的主干节点。<br><br>路由器底下还有一张光纤传送网（OTN/波分），它同时托着城域和骨干，所以画在最下面的底座里——<b>一个是"路"，一个是"地基"</b>。',
       en:'The <b>national trunk</b> linking regions and core rooms. <b>PE</b> routers are the ramps; <b>P</b> routers only forward, fast.<br><br>Beneath the routers runs an optical transport network (OTN/DWDM) that carries metro and backbone alike — so it is drawn in the base. <b>The road, and the ground under it.</b>'},
 analogy:{zh:'像<b>国家高速公路</b>，以及它底下的路基。',en:'Like <b>the national motorway</b> and its roadbed.'},

      en:'<b>Build once, run fifteen years</b>. Whether the fiber is owned or leased decides if this layer shows up as CAPEX or OPEX.'}});
step({act:0,show:['access','agg','bb','core'],hl:'core',open:'core',title:{zh:'第 4 层 · 核心网：大脑与收费站',en:'Layer 4 · Core: the brain and the tollgate'},
 body:{zh:'认证"你是谁"、接通"这通电话"、记下"你用了多少"。三块：<b>移动核心</b>（EPC/5GC）、<b>话音核心</b>（IMS，以及 2G/3G 的 CS）、<b>固网认证</b>（AAA）。<br><br><b>所有手机用户、所有通话都从这里过</b>；家宽的数据流量不经过这里，只在认证时来查一下 AAA（图中红色虚线）。',
       en:'It authenticates you, connects the call, records what you used. Three parts: the <b>mobile core</b> (EPC/5GC), the <b>voice core</b> (IMS plus 2G/3G CS), and <b>fixed-line AAA</b>.<br><br><b>Every mobile user and every call passes through here</b>; home broadband data does not — the BNG only checks the AAA at login (red dashed line).'},
 analogy:{zh:'像<b>全国总调度中心</b>，兼收费站。',en:'Like <b>the national control room</b> with a tollgate.'},
 stat:{v:'2',l:{zh:'核心机房（A/B 双活）',en:'core rooms (A/B active-active)'}},
 cfo:{zh:'<b>花钱不多，责任最大</b>——它一停，全网停；话单一错，收入就漏。容灾是必须买的保险。',
      en:'<b>Small spend, highest stakes</b> — it stops, everything stops; records drift, revenue leaks.'}});
step({act:0,show:['access','agg','bb','core','svc'],hl:'svc',open:'svc',title:{zh:'第 5 层 · 业务、计费与对外互联',en:'Layer 5 · Services, billing and interconnect'},
 body:{zh:'这一层有三件事：<b>业务平台</b>（CDN、增值业务）、<b>计费</b>（把用量变成账单和现金）、以及<b>和外部网络互联</b>（国际关口、互联网出口）。<br><br>两处虚线要看清：<b>计费 BSS 是支撑系统</b>，只收话单、不走用户流量；<b>最上方的互联网和其他运营商是外部网络</b>，不是你的资产——但打给别家的电话、出国漫游、访问境外网站，都要从这一层接出去。',
       en:'Three things: <b>service platforms</b> (CDN, value-added), <b>billing</b> (usage into invoices and cash), and <b>interconnect</b> (international gateway, internet gateway).<br><br>Two dashed boxes matter: <b>BSS is a support system</b> that receives records but carries no traffic; <b>the internet and other operators above are external networks</b>, not your assets — yet calls, roaming and foreign websites all leave through this layer.'},
 stat:{v:'收入',l:{zh:'发生在这一层',en:'happens here'}},
 cfo:{zh:'网络是管道，<b>这一层才把用量变成收入</b>；<b>跨境出口带宽</b>也在这里付钱——对内陆国家，这是最贵的一段带宽。而且注意：其中一部分收入<b>不是来自你的用户，而是来自别的运营商</b>（网间结算、漫游）——这部分的多少，取决于话单准不准、协议谈得好不好。',
      en:'The network is plumbing; <b>this layer turns usage into revenue</b> — and pays for <b>cross-border bandwidth</b>, the priciest hop for a landlocked country. And note: part of it comes <b>not from your users but from other operators</b> (interconnect, roaming) — an amount set by record accuracy and how well the agreements were negotiated.'}});
step({act:0,show:['access','agg','bb','core','svc'],funnel:true,title:{zh:'记住这个形状：一个倒金字塔',en:'Remember the shape: an inverted pyramid'},
 body:{zh:'越往<b>下</b>，设备越多、人越多、越费钱；<br>越往<b>上</b>，设备越少、越集中、越关键。',
       en:'The <b>lower</b> you go: more boxes, more people, more money.<br>The <b>higher</b>: fewer boxes, more concentration, higher stakes.'},
 cfo:{zh:'所以只需记住一句：<b>降本主要在下面两层</b>（站点、电费、出车），<b>风险主要在上面两层</b>（核心网、话单）。这基本就是网络预算的全部逻辑。',
      en:'One line: <b>savings live in the bottom two layers</b>; <b>risk lives in the top two</b>. That is most of network budgeting.'}});
step({act:0,show:['access','agg','bb','core','svc'],pillars:true,
 title:{zh:'还有两块不在主链上，却托着全网',en:'Two more blocks — beside it, and under it'},
 body:{zh:'刚才那五层，是<b>业务流量走的那条路</b>。还有两块不在这条路上，但任何一层都离不开：<br><br><b>右边的 OSS</b> —— 网管、NOC 监控、告警与派单，它让这张网<b>被看见、被调度</b>（它和最上面的计费 BSS 合称 OSS/BSS 两大支撑系统，所以都画成靛蓝虚线）；<br><b>下面的底座</b> —— 机房、电信云、光缆传送网，所有设备<b>物理上都住在这里</b>。',
       en:'Those five layers are <b>the path traffic takes</b>. Two more sit outside that path, yet nothing works without them:<br><br><b>OSS, on the right</b> — element managers, the NOC, alarms and dispatch: it makes the network <b>visible and steerable</b> (with BSS at the top it forms the OSS/BSS pair, hence the same dashed style);<br><b>the base, below</b> — rooms, telco cloud and fiber transport: where every box <b>physically lives</b>.'},
 cfo:{zh:'这两块在财务上最容易被忽略，因为它们<b>不对应任何一个具体业务</b>——可运维人力、机房电费、网管软件许可全在这里。<b>它们的成本已经分摊进上面五层，不单列一条</b>，所以看预算时要知道它藏在哪。',
      en:'Both are easy to miss financially because they <b>map to no single service</b> — yet O&M headcount, room power and management-software licences all sit here. <b>Their cost is spread across the five layers above rather than shown as its own line.</b>'}});
['call','video','home'].forEach(function(rk){
  var R=ROUTES[rk];
  step({act:1,show:['access','agg','bb','core','svc'],pillars:true,route:rk,
    title:{zh:'跟着'+R.name.zh+'走一遍',en:'Follow '+R.name.en.toLowerCase()},
    body:{zh:'同一张图，现在让它<b>动起来</b>。看这一次操作，实际穿过了哪几层。',en:'Same picture — now <b>in motion</b>.'}});
});
step({act:1,show:['access','agg','bb','core','svc'],pillars:true,title:{zh:'三条路，共用同一张承载网',en:'Three trips, one shared transport network'},
 body:{zh:'三条路<b>共用城域、骨干和出口</b>，分岔在两处：<br>① 从哪儿进来——基站还是光猫；<br>② 在哪儿被"管"——电话进 <b>IMS</b>，手机上网进 <b>移动核心 UPF</b>，家宽在城域的 <b>BNG</b> 就完成了"核心"的活，直接去出口。',
       en:'All three <b>share the metro, backbone and gateway</b>, and differ in two places:<br>① where they enter — a site or a home modem;<br>② where they are controlled — calls in <b>IMS</b>, mobile data in the <b>mobile core UPF</b>, broadband at the metro <b>BNG</b>, straight on to the gateway.'},
 cfo:{zh:'用户抱怨"网卡、打不通"，<b>绝大多数问题出在最底下一层</b>（基站、供电、最后一公里）——这也是为什么维护人力主要压在那里。',
      en:'When users complain, <b>most faults are in the bottom layer</b> — which is why maintenance headcount sits there.'}});
step({act:2,show:['access','agg','bb','core','svc'],cost:true,costs:true,pillars:true,title:{zh:'同一张图，换成"钱"来看',en:'Same picture, now in money'},
 body:{zh:'把每一层的<b>网络运营成本占比</b>画成横条——你会发现它和刚才的倒金字塔<b>完全同形</b>。',
       en:'Draw each layer\'s <b>share of network opex</b> as a bar — <b>exactly the same shape</b> as the pyramid.'},
 cfo:{zh:'<b>接入层一层就吃掉一半以上</b>。任何"网络降本"的讨论，如果没谈到站点、电费和出车，基本没谈到重点。',
      en:'<b>Access alone eats more than half.</b> Any cost discussion that skips sites, power and truck-rolls misses the point.'}});
step({act:2,show:['access','agg','bb','core','svc'],cost:true,levers:true,pillars:true,title:{zh:'每一层能动的杠杆',en:'The lever on each layer'},
 body:{zh:'成本在哪一层，杠杆就在哪一层——而且<b>每层的杠杆完全不同</b>。',en:'The lever sits where the cost sits — and <b>each layer\'s is different</b>.'},
 cfo:{zh:'优先级建议：<b>先做接入层的节能与远程化</b>（幅度最大、见效最快），再谈承载与核心的结构性调整（幅度大但周期长）。',
      en:'Sequence: <b>start with access</b> — power saving and remote resolution — then structural moves on bearer and core.'}});
/* ---- ACT 4：运维组织 ---- */
step({act:3,view:'site',show:[],
 title:{zh:'先看网在哪：机房、站点，和跟着它们走的人',en:'Start with the estate: rooms, sites, and the people that follow them'},
 body:{zh:'讲运维之前先把<b>规模讲清楚</b>。下面用一个具体假设来算：<b>全网 5,500 个无线站，分布在 16 个大区、14 个重点城市</b>；机房分四级——<b>核心机房 2 个</b>（A/B 双活，另有国际关口局 1 处）、<b>区域汇聚机房 16 个</b>、<b>综合接入机房约 120 个</b>、<b>基站站址 5,500 个</b>。<br><br>关键规律在最右一列：<b>越往下，节点越多、越分散、越无人</b>——所以人力形态也从「值守」变成「跑路」。',
       en:'Before the operating model, fix the <b>scale</b>. Working assumption: <b>5,500 radio sites across 16 regions and 14 key cities</b>; the estate has four levels — <b>2 core rooms</b> (A/B, plus one international gateway), <b>16 regional aggregation rooms</b>, <b>≈120 access rooms</b> and <b>5,500 radio sites</b>.<br><br>The pattern is in the right-hand column: <b>downward the nodes multiply, spread out and go unmanned</b> — so the labour shifts from standing watch to driving.'},
 analogy:{zh:'像一家连锁：<b>2 个总部（必须有人 7×24）、16 个省级仓、120 个城市网点、5,500 个末端货架</b>。总部养人，末端只能靠外包跑。',
          en:'Think of a retail chain: <b>2 headquarters staffed 7×24, 16 regional depots, 120 city branches, 5,500 shelves out in the field.</b> HQ keeps staff; the edge can only be covered by contractors.'},
 cfo:{zh:'这张表解释了一个 CFO 常问的问题：<b>为什么运维一定要外包一部分？</b><br><br>因为成本不是由"设备多少"决定的，而是由<b>「节点数 × 分散度 × 到场要求」</b>决定的。2 个核心机房可以自己养人值守；5,500 个无人站址，自己养人意味着要在 16 个大区常备几百人和上百辆车——<b>这是"代维"这项成本存在的物理原因，不是管理偷懒。</b>',
      en:'This table answers a question CFOs ask early: <b>why must part of O&M be outsourced at all?</b><br><br>Because cost is not driven by how much equipment there is, but by <b>node count × dispersion × arrival-time commitment</b>. Two core rooms can be staffed in-house; 5,500 unmanned sites would mean keeping hundreds of people and a hundred vehicles standing by across 16 regions. <b>That is the physical reason the outsourcing line exists — not managerial laziness.</b>'}});

step({act:3,view:'org',show:[],
 title:{zh:'运维组织长什么样：从总监到一线，各配多少人',en:'The organisation, top to bottom — and how many people at each level'},
 body:{zh:'同一个 5,500 站的假设，套进传统运营商的编制口径，得出的就是图中每个框右上角的数字。<br><br>三处值得注意：<br>① <b>NOC 分前台后台</b>——FO 照 SOP 做广度，BO 按专业域做深度；<br>② <b>越往下人越多</b>——总监 1 人，NOC 五十来人，现场两百多人；<br>③ <b>琥珀色虚线框是外包</b>——代维 227 人分成 <b>56 支作业队、12 家厂商、16 个标段</b>。',
       en:'Run the same 5,500-site assumption through a traditional operator’s staffing norms and you get the badge on each box.<br><br>Three things to notice:<br>① <b>the NOC splits front/back</b> — FO covers breadth to SOPs, BO covers depth by domain;<br>② <b>headcount grows downward</b> — one director, about fifty in the NOC, over two hundred in the field;<br>③ <b>amber dashed boxes are outsourced</b> — the 227 contractors sit in <b>56 crews, 12 firms, 16 tender lots</b>.'},
 analogy:{zh:'FO 像<b>急诊分诊台</b>，BO 像<b>专科门诊</b>：分诊台人多、流程标准、可培训；专科医生少，但难替代。',
          en:'FO is the <b>triage desk</b>, BO the <b>specialist clinic</b>: triage is numerous and protocol-driven; specialists are few and hard to replace.'},
 cfo:{zh:'底部那条合计条是这一页真正的结论：<b>全口径约 382 人，自有 141（37%）、外部 241（63%），折算人站比约 1 人 / 14 站。</b><br><br>两个用法：<br>① <b>人站比是运维效率唯一可对标的指标。</b>行业先进水平约 1 人 / 25–30 站，同样 5,500 站只需 190–220 人——<b>差额约 160 人，就是后面所有降本杠杆要去拿的空间</b>。<br>② <b>外包边界画在哪，直接决定「人力」与「代维」两项成本的比例。</b>它是一个可调旋钮，不是固定事实——看一家运营商的成本结构，先看这条线画在哪。',
      en:'The summary bar at the bottom is the real conclusion: <b>about 382 heads all-in — 141 in-house (37%), 241 external (63%) — roughly one head per 14 sites.</b><br><br>Two uses:<br>① <b>Heads-per-site is the one O&M efficiency number that benchmarks.</b> Best practice runs 1 per 25–30 sites, i.e. 190–220 for the same 5,500 — <b>a gap of some 160 heads, which is what every lever later in this chapter is aiming at</b>.<br>② <b>Where the outsourcing line is drawn sets the split between the labour and contractor cost lines.</b> It is a dial, not a given — to read an operator’s cost structure, first find that line.'}});

step({act:3,view:'org',show:[],
 title:{zh:'为什么这么分层：让最贵的人处理最少的事',en:'Why it is layered: the dearest people touch the fewest cases'},
 body:{zh:'分层不是按部门，是按<b>响应速度 × 技能深度</b>：<br><br><b>FO</b> 便宜但量大，照 SOP 处理广度问题；<b>BO</b> 贵，只碰约 10% 的疑难；<b>厂商</b> 最贵，只碰约 1% 的产品级问题。<br><br>右边那个框是这套组织的算术：<b>7×24 的一个座席 ≈ 5 个人</b>（5 班轮换，再加休假与培训冗余）。',
       en:'The tiers follow <b>response speed × depth of skill</b>, not departments:<br><br><b>FO</b> is cheap at volume and works to SOPs; <b>BO</b> is expensive and sees ~10%; <b>the vendor</b> is dearest and sees ~1%.<br><br>The box on the right is the arithmetic: <b>one 7×24 seat ≈ five people</b> (five crews, plus leave and training cover).'},
 cfo:{zh:'两个推论：<br>① <b>一旦分层失效（什么都往上升），成本立刻失控</b>——所以"升级率"是个该看的运维指标。<br>② 编制的驱动因素是<b>座席数而不是人数</b>。砍 NOC 之前先问能不能减座席；而减座席只有两条路——<b>告警收敛</b>和<b>共享 NOC</b>。',
      en:'Two consequences:<br>① <b>When the tiers stop holding, cost runs away</b> — so the escalation rate is a metric worth watching.<br>② Headcount is driven by <b>seats, not people</b>. Before cutting the NOC, ask whether a seat can go — and there are only two ways: <b>alarm compression</b> and <b>a shared NOC</b>.'}});

/* ---- ACT 5：运维怎么跑 ---- */
step({act:4,view:'flow',show:[],reveal:['mod','hint'],
 title:{zh:'运维每天在做的八件事',en:'The eight things operations does every day'},
 body:{zh:'行业骨架是 <b>FCAPS</b>（ISO 定义的网络管理五职能：故障、配置、计费、性能、安全），运营商实操中展开成这八个模块。<br><br>条形是<b>典型工时占比</b>——按它排序，而不是按重要性排序。',
       en:'The industry skeleton is <b>FCAPS</b> (the ISO management functions), expanded in practice into these eight modules.<br><br>The bars are the <b>typical share of hours</b> — sorted by that, not by perceived importance.'},
 cfo:{zh:'一个常见误解：以为运维成本主要来自"救火"。<b>排出来才看得清：巡检 22%、变更 18%，都比故障 20% 这个"尖峰"更稳定地吃掉工时。</b><br><br>这直接决定降本方向——<b>压常量（巡检数字化、变更自动化）比压尖峰更可预期</b>。',
      en:'A common misconception is that O&M cost is firefighting. <b>Sorted, it is clear: patrol at 22% and change at 18% consume hours more steadily than the 20% spike of faults.</b><br><br>That sets the direction: <b>attacking the constants is more predictable than attacking the spike.</b>'}});

step({act:4,view:'flow',show:[],reveal:['mod','flow'],opshl:'flow',
 title:{zh:'一次故障，在这四条泳道之间怎么走',en:'How one fault moves across the four lanes'},
 body:{zh:'告警进 <b>FO</b> → 15 分钟内甄别收敛 → <b>能远程修的当场关闭（80–90%）</b> → 修不了才派单给<b>现场</b>（≤30 分钟）→ 到场（城区 2h，乡村 6h+）→ 恢复 → 回 FO 验证 → 72 小时内 <b>BO</b> 复盘根因。<br><br>两条升级线是写进制度的：<b>2 小时未恢复升 BO；判定为产品缺陷升厂商。</b>',
       en:'An alarm enters <b>FO</b> → triaged within 15 min → <b>closed remotely where possible (80–90%)</b> → otherwise dispatched to the <b>field</b> (≤30 min) → on site (2h urban, 6h+ rural) → restored → verified back in FO → root-caused by <b>BO</b> within 72h.<br><br>Two escalation rules are written into policy: <b>unresolved at 2h goes to BO; a product defect goes to the vendor.</b>'},
 cfo:{zh:'看这张图只需抓一件事：<b>每一级的「关闭率」决定下一级的工作量，也就决定了下一级的编制。</b><br><br>所以远程解决率提高约 10 个百分点，现场出车量大致降一成——<b>这是运维降本里唯一一个既省人又省车、还不牺牲 SLA 的动作</b>，也是为什么它该排在第一位。',
      en:'One thing to take from this picture: <b>each tier’s close rate sets the next tier’s workload, and therefore its headcount.</b><br><br>Lift remote resolution ~10 points and truck-rolls fall roughly 10% — <b>the only move that saves both people and fleet without trading away SLA</b>, which is why it ranks first.'}});

/* ---- ACT 6：成本与改善 ---- */
step({act:5,view:'cost',show:[],
 title:{zh:'钱最后付给了谁',en:'Who the money is ultimately paid to'},
 body:{zh:'把前面的组织与模块换算成钱，就是这八项<b>成本要素</b>。<br><br>注意这和 ACT 3 不是一回事：<b>ACT 3 按「网络层」切</b>（钱花在哪段网），<b>这里按「成本要素」切</b>（钱付给了谁）。<b>同一笔钱，两种切法，互为补充、不可相加。</b><br><br>右边一列是这页真正的价值：每一项都写清了<b>对手方</b>。',
       en:'Translate the organisation and the modules into money and you get these eight <b>cost elements</b>.<br><br>This is not the same cut as ACT 3: <b>ACT 3 slices by network layer</b> (which part of the network); <b>this slices by cost element</b> (whom it is paid to). <b>Same money, two cuts — complementary, never additive.</b><br><br>The right-hand column is what makes this page useful: every line names its <b>counterparty</b>.'},
 cfo:{zh:'做预算时<b>要素视角更可操作</b>，因为<b>合同是按要素签的</b>——租约、电费、代维合同、维保合同，每一项都有对手方、有单价、有期限，可以逐项去谈。<br><br><b>层视角适合解释，要素视角适合动手。</b>',
      en:'For budgeting, <b>the element view is the actionable one</b>, because <b>contracts are signed by element</b> — leases, power, O&M and support agreements each have a counterparty, a unit price and a term.<br><br><b>The layer view explains; the element view acts.</b>'}});

step({act:5,view:'link',show:[],
 title:{zh:'哪个杠杆压哪一项：一张覆盖矩阵',en:'Which lever cuts which line: a coverage matrix'},
 body:{zh:'降本方案和成本项之间<b>不是一对一</b>。这张矩阵把关系摊开了：<br><br><b>一对多</b>——"退网简化"同时压电费、维保、租金；<br><b>多对一</b>——"人力"被集中远程和自动化两个杠杆同时覆盖；<br><b>多对多</b>——六个杠杆和八项成本之间是一张网。<br><br>最下面一行是每个杠杆<b>一共触及了多少成本</b>：集中远程、自动化、退网简化各约 26%，是"面"最大的三个。',
       en:'Savings levers and cost lines are <b>not one-to-one</b>. This matrix lays the relationship out:<br><br><b>One-to-many</b> — sunsetting cuts power, support and rent at once;<br><b>many-to-one</b> — labour is covered by both centralisation and automation;<br><b>many-to-many</b> — six levers against eight lines form a web.<br><br>The bottom row is <b>how much cost each lever touches in total</b>: centralisation, automation and sunset each about 26% — the widest three.'},
 analogy:{zh:'像给一栋楼做节能改造：换窗户、换锅炉、加保温，每项措施影响的账单科目不一样，有的重叠、有的互补 —— <b>关键是别把重叠的部分重复计算两遍节约。</b>',
          en:'Like retrofitting a building: new windows, a new boiler, more insulation — each touches different lines on the bill, some overlapping. <b>The trick is not to count the overlap twice.</b>'},
 cfo:{zh:'这张表的用法是<b>反过来用</b>：拿到任何一个降本提案，先问它连到左边哪几项、覆盖多少成本。<br><br><b>还要盯住缺口</b>——传输线路租费占 10%，但整列只有两个○，没有主力杠杆。它真正的解法是"自建替租"，那是<b>用 CAPEX 换 OPEX</b>，属于投资决策，不在运维改善范围内。这类缺口不说清楚，降本目标就会悬空。',
      en:'Use this table <b>in reverse</b>: for any proposal, first ask which lines it connects to and how much cost those add up to.<br><br><b>And watch the gaps</b> — leased transmission is 10% of spend but has only secondary coverage. Its real fix is building instead of leasing: <b>CAPEX for OPEX</b>, an investment decision outside O&M. Unnamed gaps are how savings targets end up unfundable.'}});

step({act:5,view:'mech',show:[],
 title:{zh:'杠杆是怎么起作用的：动作 → 中间变量 → 成本',en:'How each lever works: action → variable → cost'},
 body:{zh:'每张卡都是一条<b>因果链</b>，中间那一格是关键：<b>可测的中间变量</b>。<br><br>比如自动化不是"省人"，而是先把<b>每天需要人看的告警从 12,000 条压到 3,000 条</b>，席位才减得下来；能效不是"省电费"，而是先把<b>单站日耗从 42 度降到 37 度</b>。<br><br>灰条是现状，彩条是改善后。',
       en:'Each card is a <b>causal chain</b>, and the middle box is the point: a <b>measurable variable</b>.<br><br>Automation does not "save people" — it first cuts <b>alarms a human must read from 12,000 a day to 3,000</b>, and only then do seats go. Energy work does not "save power" — it first takes <b>a site from 42 to 37 kWh a day</b>.<br><br>Grey is today, colour is after.'},
 analogy:{zh:'医生不会说"我要让你更健康"，他会说"把血压从 160 降到 130"。<b>中间变量就是运维的血压读数</b>——它可测、可追踪、可问责。',
          en:'A doctor does not say "I will make you healthier" — she says "we are taking your blood pressure from 160 to 130". <b>The variable is operations’ blood-pressure reading</b>: measurable, trackable, accountable.'},
 cfo:{zh:'这一页给你三个可以当场用的问题：<b>动作是什么？哪个中间变量会动、动多少？落到哪一项成本、压几个点？</b>三个都答得上来才叫方案。<br><br>还有一条提醒：卡片底部引用的厂商数据，<b>口径与前提各不相同，不能横向相加</b>。比如同样是 AI 节能，运营商自己实测是 −6%，厂商宣称是 −11.6%——<b>做预算时用下限，谈合同时用上限。</b>',
      en:'This page gives you three questions to use on the spot: <b>what is the action, which variable moves and by how much, and which cost line does it land on?</b> All three must be answerable.<br><br>One caution: the vendor figures at the bottom of each card use <b>different baselines and cannot be added together</b>. For the same AI power-saving, an operator measured −6% while a vendor claims −11.6%. <b>Budget on the low end; negotiate on the high end.</b>'}});

step({act:5,view:'plan',show:[],
 title:{zh:'先做哪个：一张两年半的路线图',en:'Sequencing: a two-and-a-half-year roadmap'},
 body:{zh:'排序依据是<b>幅度 × 速度 × 风险</b>，不是重要性。<br><br><b>快赢（0–6 个月）</b>不动组织、不动网络结构，累计约 3–6%；<br><b>结构性（6–18 个月）</b>要动组织与合同，累计到 9–12%；<br><b>长周期（18 个月+）</b>幅度最大，累计到 15–18%，但要先解决用户迁移与监管许可。<br><br>下面那三根柱子：<b>深色是区间下限（比较有把握），浅色是上限（要执行到位才拿得到）。</b>',
       en:'Ordered by <b>impact × speed × risk</b>, not importance.<br><br><b>Quick wins (0–6 months)</b> touch neither the organisation nor the network — about 3–6% cumulative;<br><b>structural (6–18 months)</b> touches both, taking it to 9–12%;<br><b>long haul (18 months+)</b> is the biggest at 15–18%, but subscriber migration and regulatory approval come first.<br><br>On the bars below: <b>solid is the low end (reasonably safe), pale is the high end (only with full execution).</b>'},
 cfo:{zh:'一条经验：<b>组织重组留到最后做。</b>能效和合同分级做错了，下个月就能改回来；<b>但运维组织动错了，MTTR 的恶化要滞后半年才显现</b>——等看见的时候已经很难追回。<br><br>换算回 ACT 4 的编制：这三段合起来，是把人站比从 <b>1 人 / 14 站推到 1 人 / 18–20 站</b>，而不是一步到行业先进的 1/25。<b>承诺 1/25 是不诚实的；承诺 1/18 并给出路线图，是可以签字的。</b>',
      en:'A rule of thumb: <b>leave the reorganisation for last.</b> Energy and contract mistakes are reversible next month; <b>an organisational mistake shows up as MTTR decay only half a year later</b> — too late to recover easily.<br><br>Translated back into the ACT 4 headcount: these three phases move heads-per-site from <b>1 per 14 to 1 per 18–20</b> — not to the best-practice 1 per 25 in one go. <b>Promising 1/25 would be dishonest; promising 1/18 with a roadmap is something you can sign.</b>'}});

/* ---- ACT 7：平台与厂商方案 ---- */
step({act:6,view:'vstack',show:[],
 title:{zh:'运维平台市场：先搞清楚你要买的是哪一层',en:'The platform market: first work out which layer you are buying'},
 body:{zh:'运维自动化不是一个市场，是<b>四个叠在一起的市场</b>：<br><br><b>L4 流程与工单</b>（ServiceNow 类）· <b>L3 跨域智能</b>（IBM Netcool / Cloud Pak for AIOps，现已更名 Concert Operate）· <b>L2 单域网管与自动化</b>（Ericsson ENM＋EIAP、Huawei iMaster、Nokia MantaRay）· <b>L1 站点与能效</b>（Huawei PowerStar、Ericsson Energy Ops、Nokia AVA）。<br><br><b>没有一家覆盖全部四层。</b>',
       en:'O&M automation is not one market but <b>four stacked markets</b>:<br><br><b>L4 process and ticketing</b> (the ServiceNow class) · <b>L3 cross-domain AIOps</b> (IBM Netcool / Cloud Pak for AIOps, now renamed Concert Operate) · <b>L2 domain management and automation</b> (Ericsson ENM+EIAP, Huawei iMaster, Nokia MantaRay) · <b>L1 site power and energy</b> (Huawei PowerStar, Ericsson Energy Ops, Nokia AVA).<br><br><b>No vendor covers all four.</b>'},
 analogy:{zh:'像盖房子：<b>L1 是水电，L2 是各个房间的装修，L3 是整栋楼的智能中控，L4 是物业的工单系统。</b>装修公司做不了中控，中控公司不懂水电 —— 谁说自己四层全能，都要多问一句。',
          en:'Like a building: <b>L1 is the wiring, L2 is fitting out each room, L3 is the building-wide control system, L4 is the facilities ticketing.</b> The fit-out firm cannot do the control system and the control firm does not know the wiring — so question anyone claiming all four.'},
 cfo:{zh:'这一页要记住的只有一句：<b>L2 最有效，但它绑定厂商；L3 最中立，但它对无线域的理解最浅。</b>这就是多厂商运营商的核心矛盾，也是后面所有选型分歧的根源。<br><br>还有一个可以立刻用上的结论：<b>L1 能效是唯一一层与平台选型基本无关的</b>——它可以现在就启动，不用等任何选型结论。<b>这意味着 ACT 6 里最快的那个杠杆，不在今天这场讨论的依赖链上。</b>',
      en:'One line to remember: <b>L2 is the most effective but locks you in; L3 is the most neutral but understands radio the least.</b> That is the dilemma for any multi-vendor operator, and the root of every disagreement that follows.<br><br>One conclusion you can act on today: <b>L1 energy is the only layer largely independent of the platform choice</b> — it can start now. <b>Which means the fastest lever in ACT 6 does not depend on this discussion at all.</b>'}});

step({act:6,view:'vmatrix',show:[],
 title:{zh:'四家主流方案：强在哪，代价是什么',en:'Four mainstream platforms: strengths and prices'},
 body:{zh:'四家的定位差别很清楚：<br><br><b>IBM</b> 是中立的汇聚层（90+ 工具可接入），但不理解无线；<b>Ericsson</b> 平台最开放（100+ rApps 生态，2026 年起扩展到核心网），常与托管服务打包；<b>Huawei</b> 是唯一从站点电源到核心网的全栈，能效最强但绑定最深；<b>Nokia</b> 的 SON 见效快，幅度小一些。<br><br>倒数第二行值得逐字读：<b>那是各家的公开宣称成效。</b>',
       en:'The four sit in clearly different places:<br><br><b>IBM</b> is the neutral aggregation layer (90+ tools) but does not understand radio; <b>Ericsson</b> has the most open platform (a 100+ rApp ecosystem, extended to core in 2026) and usually bundles managed services; <b>Huawei</b> is the only full stack from site power to core — strongest on energy, deepest lock-in; <b>Nokia</b>’s SON lands fast but delivers less.<br><br>The second-to-last row deserves a careful read: <b>those are the publicly claimed results.</b>'},
 cfo:{zh:'请特别注意那一行数据的<b>来源差别</b>：<br>• IBM 的"噪声 −99%、MTTR −70%"来自 <b>IBM 自己委托的 Forrester 研究</b>；<br>• Ericsson 自己把数据标注为 <b>"指示性"</b>；<br>• Huawei 的 −11.6% 是<b>厂商宣称</b>；<br>• Nokia 的 −6% 是 <b>stc 这家运营商自己说的实测值</b>。<br><br><b>唯一一个由买方而不是卖方说出来的数字，恰好是最小的那个。</b>这不是巧合 —— 谈判时请把这条规律带进会议室：<b>厂商宣称值打三折做预算，全额写进合同的 SLA 与罚则。</b>',
      en:'Note carefully where each figure comes from:<br>• IBM’s "−99% noise, −70% MTTR" is from a <b>Forrester study IBM itself commissioned</b>;<br>• Ericsson labels its own numbers <b>"indicative"</b>;<br>• Huawei’s −11.6% is a <b>vendor claim</b>;<br>• Nokia’s −6% is <b>stated by the operator, stc</b>.<br><br><b>The only number spoken by a buyer rather than a seller is also the smallest.</b> That is not a coincidence. Take the rule into the negotiation: <b>budget at about a third of the claim, and write the full claim into the SLA and the penalty clause.</b>'}});

step({act:6,view:'vpick',show:[],
 title:{zh:'怎么选：三条路线，和三个决定性问题',en:'How to choose: three routes, three decisive questions'},
 body:{zh:'<b>路线 A 单厂商全栈</b>——最快、最深，但锁定加重；<b>路线 B 中立层在上</b>——保留议价能力，但集成工作量大；<b>路线 C 托管服务</b>——把人力风险转出去，代价是自有能力流失。<br><br>中间那个框是<b>决策三问</b>：主设备集中度多少？痛点是人还是电？三年后还想不想有议价能力？<br><br>最下面是对 KAR 的具体建议。',
       en:'<b>Route A, single-vendor full stack</b> — fastest and deepest, at the price of lock-in; <b>Route B, a neutral layer on top</b> — keeps your leverage but demands heavy integration; <b>Route C, managed services</b> — transfers the people risk and loses the in-house capability.<br><br>The middle band holds <b>the three questions</b>: how concentrated is the equipment base, is the pain people or power, and do you still want leverage in three years?<br><br>At the bottom, a concrete recommendation.'},
 cfo:{zh:'把这件事翻译成财务语言：<b>这不是技术选型，是在决定用多少议价能力去换多少确定性。</b><br><br>路线 A 和 C 都是<b>拿未来的议价能力换今天的确定性</b>——A 换的是落地速度，C 换的是人力风险。路线 B 是<b>花今天的集成成本买未来的议价能力</b>。三条路没有对错，但<b>代价必须在决策时就写进纪要</b>，而不是三年后续约谈判桌上才发现。<br><br>最实际的一步：<b>先做 L1 能效和维保分级</b>，这两件事不依赖任何选型结论，六个月就能见到现金；同时把"主设备集中度"和"FO 席位下限"这两个数摸清楚。<b>这两个数一出来，A 还是 B 就不用再争了。</b>',
      en:'In financial terms: <b>this is not a technology choice — it is a decision about how much future leverage to trade for certainty today.</b><br><br>Routes A and C both <b>spend future bargaining power on present certainty</b> — A buys speed, C buys relief from people risk. Route B <b>spends integration cost today to keep leverage later</b>. None is wrong, but <b>the price has to be written into the minutes at decision time</b>, not discovered at the renewal table three years on.<br><br>The practical move: <b>start L1 energy and tiered support now</b> — neither depends on the platform decision and both show cash within six months — while establishing two numbers: vendor concentration, and the floor on FO seats. <b>Once you have those two, the A-versus-B argument settles itself.</b>'}});

/* ---- 收束：CFO 在网络上的方向 ---- */
step({act:6,tag:'CFO AGENDA',show:['access','agg','bb','core','svc'],cost:true,pillars:true,
 title:{zh:'收束：CFO 在网络上该抓的四个方向',en:'Wrap-up: four directions for the CFO'},
 body:{zh:'把前面七幕压成四句话，对照左边这张图：<br><br>① <b>降本主战场在最下层</b>——接入层约占网络 opex 的 55%：能效、站址共享、远程化。三件事都不依赖平台选型，现在就能启动。<br>② <b>收入保护在最上层</b>——话单完整性与收入保障（RA）、网间与漫游结算、跨境出口带宽议价，离现金最近。<br>③ <b>结构性决策先要数据</b>——主设备厂商集中度、FO 席位下限；人站比目标是 1/14 → 1/18–20，不是一步到 1/25。<br>④ <b>投资口径单独算</b>——传输"自建替租"、2G/3G 退网、核心云化，都是 CAPEX 换 OPEX，按回收期逐项评估。',
       en:'Seven acts in four lines, read against the picture:<br><br>① <b>Savings live at the bottom</b> — access is ~55% of network opex: energy, site sharing, remote resolution. None needs a platform decision; all can start now.<br>② <b>Revenue protection lives at the top</b> — record integrity and revenue assurance, interconnect and roaming settlement, cross-border bandwidth deals: closest to cash.<br>③ <b>Structural decisions need data first</b> — vendor concentration and the floor on FO seats; target heads-per-site 1/14 → 1/18–20, not 1/25 in one go.<br>④ <b>Treat investments separately</b> — build-instead-of-lease transport, 2G/3G sunset and core cloudification all trade CAPEX for OPEX; judge each on payback.'},
 cfo:{zh:'三条<b>不该碰的红线</b>：<br>• <b>环网与双路由</b>——那是可用性的保险，省下的远小于一次大面积断网；<br>• <b>核心网容灾与 IMS 紧急呼叫</b>——牌照义务；<br>• <b>安全与合规接口</b>——依法监听、数据留存。<br><br>其余每一项都可以谈效率。另外记住顺序：<b>组织重组永远放在最后。</b>',
      en:'Three <b>red lines</b>:<br>• <b>rings and diverse routing</b> — availability insurance; the saving is far smaller than one major outage;<br>• <b>core redundancy and IMS emergency calling</b> — licence obligations;<br>• <b>security and compliance interfaces</b> — lawful interception, data retention.<br><br>Everything else is open to efficiency. And keep the order: <b>reorganisation always goes last.</b>'}});

/* ---- ACT 8：术语对照（放在最后） ---- */
step({act:7,show:['access','agg','bb','core','svc'],tech:true,terms:true,pillars:true,title:{zh:'工程师管它们叫什么',en:'What the engineers call them'},
 body:{zh:'同一张图，把大白话换成工程师的术语。<b>下次看到技术方案或厂商 PPT，你能对上号。</b>',
       en:'Same picture, plain words swapped for engineering terms.'},
 cfo:{zh:'你不需要记住这些缩写。<b>你只需要知道它属于哪一层</b>——属于哪一层，就决定了它多贵、谁在维护、能不能省。',
      en:'You do not need the acronyms. <b>You need the layer</b> — it tells you the cost, the owner, and whether it can be cut.'}});
